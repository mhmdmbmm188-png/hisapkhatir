<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل العمال والرواتب - محمد المرعي</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background: #0f172a; padding: 12px; color: #1e293b; min-height: 100vh; }
        .app { background: #ffffff; padding: 15px; border-radius: 20px; width: 100%; max-width: 480px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
        .app-header { text-align: center; margin-bottom: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        h2 { color: #312e81; font-size: 20px; font-weight: 800; }
        .developer-tag { font-size: 11px; color: #6366f1; font-weight: 700; margin-top: 2px; }
        .section-title { font-size: 14px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
        .btn-primary { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-danger { background: #dc2626; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .worker-card { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .worker-name { font-size: 14px; font-weight: 800; color: #0f172a; }
        .worker-salary { font-size: 11px; color: #64748b; font-weight: 600; margin-top: 2px; }
        .input-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 3px; color: #334155; font-size: 11px; font-weight: 700; }
        input, select { width: 100%; padding: 9px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 12px; outline: none; background: #f8fafc; color: #0f172a; font-weight: 600; }
        .day-record-box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px; border-radius: 10px; margin-bottom: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .day-record-header { font-weight: 800; color: #312e81; margin-bottom: 3px; }
        .summary-box { background: #4f46e5; color: white; padding: 12px; border-radius: 12px; margin-top: 10px; }
        .summary-box div { margin-bottom: 3px; font-size: 12px; font-weight: 700; }
        .summary-total { font-size: 14px !important; font-weight: 800 !important; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px; margin-top: 5px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
        .cal-day-name { font-size: 11px; font-weight: 800; color: #64748b; text-align: center; padding-bottom: 4px; }
        .cal-day { padding: 8px 0; background: #f1f5f9; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; color: #1e293b; }
        .cal-day.recorded-present { background: #22c55e !important; color: white !important; }
        .cal-day.recorded-absent { background: #dc2626 !important; color: white !important; }
        .cal-day.recorded-weekend { background: #64748b !important; color: white !important; }
        .cal-day.empty { background: transparent; cursor: default; }
        .hidden { display: none !important; }
        #syncStatus { text-align: center; font-size: 11px; padding: 6px; border-radius: 6px; margin-top: 6px; font-weight: 700; background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

<div class="app">
    <div class="app-header">
        <h2>سجل العمال والرواتب</h2>
        <div class="developer-tag">إعداد: محمد المرعي</div>
        <div id="syncStatus">🔄 جاري الاتصال بالسحابة...</div>
    </div>

    <!-- واجهة الرئيسية -->
    <div id="mainHomeView">
        <div class="section-title">قائمة العمال</div>
        <button class="btn-primary" id="openAddBtn" type="button">➕ إضافة عامل جديد</button>
        <div id="workersListContainer" style="max-height: 300px; overflow-y: auto; margin-top: 6px;"></div>
    </div>

    <!-- واجهة إضافة عامل -->
    <div id="addWorkerView" class="hidden">
        <button class="btn-secondary" id="closeAddBtn" type="button" style="margin-bottom: 10px;">⬅ العودة للقائمة</button>
        <div class="section-title">إضافة عامل جديد</div>
        <div class="input-group">
            <label>اسم العامل (باللغة العربية)</label>
            <input type="text" id="newWorkerName" placeholder="أدخل اسم العامل">
        </div>
        <div class="input-group">
            <label>الراتب الشهري الأساسي</label>
            <input type="number" id="newWorkerSalary" placeholder="أدخل الراتب">
        </div>
        <button class="btn-primary" id="saveWorkerBtn" type="button" style="margin-top: 10px;">💾 حفظ العامل</button>
    </div>

    <!-- واجهة ملف العامل -->
    <div id="workerProfileView" class="hidden">
        <button class="btn-secondary" id="backToHomeBtn" type="button" style="margin-bottom: 8px;">⬅ العودة للقائمة</button>
        
        <div style="background: #e0e7ff; padding: 8px; border-radius: 10px; text-align: center; margin-bottom: 8px;">
            <div id="profileWorkerName" style="font-size: 14px; font-weight: 800; color: #312e81;"></div>
            <div id="profileWorkerSalary" style="font-size: 11px; color: #4338ca; font-weight: 700;"></div>
        </div>

        <div style="border-top: 1.5px solid #f1f5f9; padding-top: 6px;">
            <div class="section-title" style="font-size:12px;">تسجيل حركة يومية</div>
            
            <div class="input-group">
                <label>التاريخ (اضغط لاختيار اليوم)</label>
                <input type="text" id="recordDateDisplay" readonly style="cursor: pointer; background: #fff; text-align: center; font-weight: 800; color: #4f46e5;">
                <input type="hidden" id="recordDate">
            </div>

            <div class="input-group">
                <label>حالة الدوام</label>
                <select id="recordStatus">
                    <option value="present">داوم (كامل)</option>
                    <option value="absent">غائب</option>
                    <option value="weekend">عطلة رسمية (سبت/أحد)</option>
                </select>
            </div>

            <div id="extraFieldsContainer">
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعة ونصف)</label>
                    <input type="number" id="recordOvertime" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعتين)</label>
                    <input type="number" id="recordOvertimeDouble" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات التأخير</label>
                    <input type="number" id="recordDelay" value="0">
                </div>
                <div class="input-group">
                    <label>مبلغ مسحوب (سلفية)</label>
                    <input type="number" id="recordWithdrawn" value="0">
                </div>
            </div>

            <button class="btn-primary" id="saveRecordBtn" type="button">💾 حفظ حركة هذا اليوم</button>
        </div>

        <div style="margin-top: 4px;">
            <div class="section-title" style="font-size:12px;">سجل الأيام المسجلة</div>
            <div id="workerDaysList" style="max-height: 150px; overflow-y: auto;"></div>
        </div>

        <div class="summary-box" id="workerFinancialSummary"></div>
        <button class="btn-primary" id="copyReportBtn" type="button" style="background: #10b981; margin-top: 10px;">📋 نسخ التقرير المفصل وإرساله</button>
    </div>

    <!-- واجهة التقويم -->
    <div id="calendarView" class="hidden">
        <button class="btn-secondary" id="closeCalBtn" type="button" style="margin-bottom: 10px;">⬅ العودة لملف العامل</button>
        <div style="text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <button class="btn-secondary" id="prevMonthBtn" type="button" style="width: auto; padding: 6px 12px;">▶</button>
                <span id="calMonthYearTitle" style="font-weight: 800; color: #312e81; font-size: 14px;"></span>
                <button class="btn-secondary" id="nextMonthBtn" type="button" style="width: auto; padding: 6px 12px;">◀</button>
            </div>
            <div class="calendar-grid">
                <div class="cal-day-name">أحد</div>
                <div class="cal-day-name">إثنين</div>
                <div class="cal-day-name">ثلاثاء</div>
                <div class="cal-day-name">أربعاء</div>
                <div class="cal-day-name">خميس</div>
                <div class="cal-day-name">جمعة</div>
                <div class="cal-day-name">سبت</div>
            </div>
            <div id="calDaysContainer" class="calendar-grid" style="margin-top: 4px;"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDcQOkPejPSlzOxQixqaQFViLO96QRJo8Q",
        authDomain: "hisapkhatir.firebaseapp.com",
        databaseURL: "https://hisapkhatir-default-rtdb.firebaseio.com",
        projectId: "hisapkhatir",
        storageBucket: "hisapkhatir.firebasestorage.app",
        messagingSenderId: "493775178117",
        appId: "1:493775178117:web:4a2daf8c7f75011f55dcec"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('workers_data');

    let workers = [];
    let activeWorkerId = null;
    let calCurrentDate = new Date();
    
    const localOffset = new Date().getTimezoneOffset() * 60000;
    const todayStr = new Date(Date.now() - localOffset).toISOString().split('T')[0];

    document.getElementById('recordDate').value = todayStr;
    document.getElementById('recordDateDisplay').value = todayStr;

    const statusEl = document.getElementById('syncStatus');

    function updateStatus(text, type) {
        statusEl.innerText = text;
        if (type === 'success') {
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#166534';
        } else if (type === 'error') {
            statusEl.style.background = '#fee2e2';
            statusEl.style.color = '#991b1b';
        } else {
            statusEl.style.background = '#f1f5f9';
            statusEl.style.color = '#64748b';
        }
    }

    let isInitialLoad = true;
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        workers = (data && data.list) ? data.list : [];
        renderWorkersList();
        if (activeWorkerId !== null && workers[activeWorkerId]) {
            renderWorkerDays();
        }
        if (isInitialLoad) {
            isInitialLoad = false;
            updateStatus('✅ متصل بالسحابة (جاهز للاستخدام)', 'success');
        }
    }, (error) => {
        console.error(error);
        updateStatus('❌ خطأ في الاتصال بالسحابة', 'error');
    });

    function saveCloudData(callback) {
        updateStatus('💾 جاري الحفظ...', 'loading');
        dbRef.set({ list: workers }).then(() => {
            updateStatus('✅ تم الحفظ بنجاح في السحابة', 'success');
            if (callback) callback();
        }).catch(err => {
            console.error(err);
            updateStatus('❌ فشل الحفظ بالسحابة', 'error');
            alert('فشل الحفظ: تحقق من الاتصال بالإنترنت.');
        });
    }

    document.getElementById('openAddBtn').addEventListener('click', function() {
        document.getElementById('newWorkerName').value = '';
        document.getElementById('newWorkerSalary').value = '';
        document.getElementById('mainHomeView').classList.add('hidden');
        document.getElementById('addWorkerView').classList.remove('hidden');
    });

    document.getElementById('closeAddBtn').addEventListener('click', function() {
        document.getElementById('addWorkerView').classList.add('hidden');
        document.getElementById('mainHomeView').classList.remove('hidden');
    });

    document.getElementById('saveWorkerBtn').addEventListener('click', function() {
        const name = document.getElementById('newWorkerName').value.trim();
        const salary = parseFloat(document.getElementById('newWorkerSalary').value) || 0;

        if (!name || salary <= 0) {
            alert('الرجاء إدخال اسم العامل بشكل صحيح وراتب أكبر من الصفر');
            return;
        }

        workers.push({ name: name, salary: salary, records: [] });
        
        saveCloudData(() => {
            document.getElementById('addWorkerView').classList.add('hidden');
            document.getElementById('mainHomeView').classList.remove('hidden');
            renderWorkersList();
        });
    });

    document.getElementById('backToHomeBtn').addEventListener('click', function() {
        activeWorkerId = null;
        document.getElementById('workerProfileView').classList.add('hidden');
        document.getElementById('mainHomeView').classList.remove('hidden');
        renderWorkersList();
    });

    document.getElementById('recordDateDisplay').addEventListener('click', function() {
        document.getElementById('workerProfileView').classList.add('hidden');
        document.getElementById('calendarView').classList.remove('hidden');
        renderCustomCalendar();
    });

    document.getElementById('closeCalBtn').addEventListener('click', function() {
        document.getElementById('calendarView').classList.add('hidden');
        document.getElementById('workerProfileView').classList.remove('hidden');
    });

    document.getElementById('prevMonthBtn').addEventListener('click', function() {
        calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
        renderCustomCalendar();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', function() {
        calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
        renderCustomCalendar();
    });

    document.getElementById('recordStatus').addEventListener('change', function() {
        const status = this.value;
        const extraFields = document.getElementById('extraFieldsContainer');
        if (status === 'absent' || status === 'weekend') {
            extraFields.classList.add('hidden');
        } else {
            extraFields.classList.remove('hidden');
        }
    });

    document.getElementById('saveRecordBtn').addEventListener('click', function() {
        const date = document.getElementById('recordDate').value;
        const status = document.getElementById('recordStatus').value;
        
        if (!date) {
            alert('الرجاء اختيار التاريخ');
            return;
        }

        if (activeWorkerId === null || !workers[activeWorkerId]) {
            alert('الرجاء اختيار العامل مرة أخرى');
            return;
        }

        const worker = workers[activeWorkerId];
        if (!worker.records) {
            worker.records = [];
        }

        worker.records = worker.records.filter(r => r.date !== date);

        worker.records.push({
            date: date,
            status: status,
            overtime: status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertime').value) || 0),
            overtimeDouble: status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertimeDouble').value) || 0),
            delay: status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordDelay').value) || 0),
            withdrawn: parseFloat(document.getElementById('recordWithdrawn').value) || 0
        });

        worker.records.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        saveCloudData(() => {
            renderWorkerDays();
        });
    });

    function renderWorkersList() {
        const container = document.getElementById('workersListContainer');
        container.innerHTML = '';
        
        if (workers.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:15px;">لا يوجد عمال مضافين حالياً.</div>';
            return;
        }

        workers.forEach((worker, index) => {
            const card = document.createElement('div');
            card.className = 'worker-card';
            card.innerHTML = `
                <div style="flex-grow: 1; cursor: pointer;" onclick="openWorkerProfile(${index})">
                    <span class="worker-name">👤 ${worker.name}</span>
                    <span class="worker-salary">الراتب: ${worker.salary} ليرة</span>
                </div>
                <div>
                    <button class="btn-danger" type="button" onclick="deleteWorker(event, ${index})">حذف</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openWorkerProfile(index) {
        activeWorkerId = index;
        const worker = workers[index];
        document.getElementById('profileWorkerName').innerText = worker.name;
        document.getElementById('profileWorkerSalary').innerText = `الراتب الشهري: ${worker.salary} ليرة | اليومية: ${(worker.salary/30).toFixed(1)} ليرة`;
        
        document.getElementById('mainHomeView').classList.add('hidden');
        document.getElementById('workerProfileView').classList.remove('hidden');
        renderWorkerDays();
    }
    window.openWorkerProfile = openWorkerProfile;

    function deleteWorker(event, index) {
        event.stopPropagation();
        if (confirm('هل أنت متأكد من حذف هذا العامل؟')) {
            workers.splice(index, 1);
            saveCloudData(() => {
                renderWorkersList();
            });
        }
    }
    window.deleteWorker = deleteWorker;

    function renderWorkerDays() {
        const container = document.getElementById('workerDaysList');
        const summaryContainer = document.getElementById('workerFinancialSummary');
        container.innerHTML = '';
        
        if (activeWorkerId === null || !workers[activeWorkerId]) return;
        
        const worker = workers[activeWorkerId];
        const records = worker.records || [];
        
        if (records.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">لا توجد حركات مسجلة.</div>';
            summaryContainer.innerHTML = '<div>المجموع: 0 ليرة</div>';
            return;
        }

        let totalDays = 0, totalAbsence = 0, totalOvertime = 0, totalOvertimeDouble = 0, totalDelay = 0, totalWithdrawn = 0;

        records.forEach((rec, index) => {
            let statusText = '';
            if (rec.status === 'present') { statusText = '✅ داوم'; totalDays++; }
            else if (rec.status === 'absent') { statusText = '❌ غائب'; totalAbsence++; }
            else if (rec.status === 'weekend') { statusText = '🏖️ عطلة'; }

            totalOvertime += (rec.overtime || 0);
            totalOvertimeDouble += (rec.overtimeDouble || 0);
            totalDelay += (rec.delay || 0);
            totalWithdrawn += (rec.withdrawn || 0);

            const recordDiv = document.createElement('div');
            recordDiv.className = 'day-record-box';
            recordDiv.innerHTML = `
                <div>
                    <div class="day-record-header">${rec.date} - ${statusText}</div>
                    <div style="color:#
