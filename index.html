<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمال والرواتب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; padding: 10px; color: #1e293b; }
        .app { background: #fff; max-width: 480px; margin: 0 auto; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #312e81; font-size: 18px; margin-bottom: 5px; }
        .dev { text-align: center; font-size: 11px; color: #6366f1; margin-bottom: 10px; font-weight: bold; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 11px; border-radius: 6px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #f8fafc; }
        .worker-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .hidden { display: none !important; }
        .summary { background: #4f46e5; color: #fff; padding: 14px; border-radius: 8px; margin-top: 12px; font-size: 13px; font-weight: bold; white-space: pre-line; line-height: 1.8; }
        .day-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; font-size: 13px; line-height: 1.6; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
        .cal-day { padding: 8px 0; background: #22c55e; color: #fff; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .cal-day.absent { background: #dc2626; color: #fff; }
        .profile-header { background: #e0e7ff; padding: 12px; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .edit-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 16px; cursor: pointer; }
        .backup-group { display: flex; gap: 5px; margin-bottom: 12px; }
        .backup-group .btn { margin-bottom: 0; font-size: 12px; padding: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="app">
    <div id="connStatus" style="font-size:11px; text-align:center; padding:5px; background:#f1f5f9; border-radius:6px; margin-bottom:12px; color:#64748b; font-weight:bold;">جاري التحقق من الاتصال...</div>
    <h2>سجل العمال والرواتب</h2>
    <div class="dev">إعداد: محمد المرعي</div>

    <div id="homeView">
        <button type="button" class="btn btn-primary" onclick="showAddWorker()">➕ إضافة عامل جديد</button>
        <div class="backup-group">
            <button type="button" class="btn btn-warning" onclick="exportData()">⬇️ حفظ نسخة لجهازي</button>
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('importFile').click()">⬆️ استعادة</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
        </div>
        <div id="workersList"></div>
    </div>

    <div id="addView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="showHome()">⬅ رجوع</button>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="workerName" placeholder="">
        </div>
        <div class="input-group">
            <label>الراتب الشهري</label>
            <input type="number" id="workerSalary" placeholder="">
        </div>
        <button type="button" class="btn btn-primary" onclick="saveWorker()">💾 حفظ العامل</button>
    </div>

    <div id="profileView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="showHome()">⬅ رجوع للقائمة</button>
        <div class="profile-header">
            <div id="displayWorkerInfo">
                <div id="pName" style="font-weight:bold; color:#312e81; font-size:15px; text-align:center;"></div>
                <div id="pSalary" style="font-size:12px; color:#4338ca; text-align:center; margin-top:4px;"></div>
                <button type="button" class="edit-btn" onclick="enableEditMode()">✏️</button>
            </div>
            <div id="editWorkerInfo" class="hidden">
                <div class="input-group" style="margin-bottom:8px;">
                    <label>اسم العامل</label>
                    <input type="text" id="editWorkerName">
                </div>
                <div class="input-group" style="margin-bottom:8px;">
                    <label>الراتب الشهري</label>
                    <input type="number" id="editWorkerSalary">
                </div>
                <button type="button" class="btn btn-primary" style="padding:8px; font-size:12px; margin-bottom:6px;" onclick="updateWorkerInfo()">💾 تحديث بيانات العامل</button>
                <button type="button" class="btn btn-secondary" style="padding:8px; font-size:12px; margin-bottom:0;" onclick="cancelEditMode()">❌ إلغاء</button>
            </div>
        </div>

        <div class="input-group">
            <label>التاريخ</label>
            <input type="text" id="recDate" readonly onclick="showCal()" style="background:#fff; text-align:center; font-weight:bold; cursor:pointer;">
        </div>

        <div class="input-group">
            <label>الحالة</label>
            <select id="recStatus" onchange="toggleExtra()">
                <option value="present">دوام (افتراضي)</option>
                <option value="absent">غائب</option>
            </select>
        </div>

        <div id="extraContainer">
            <div class="input-group">
                <label>ساعات الإضافي (1.5x)</label>
                <input type="number" id="recOT" placeholder="">
            </div>
            <div class="input-group">
                <label>ساعات الإضافي (2x)</label>
                <input type="number" id="recOT2" placeholder="">
            </div>
            <div class="input-group">
                <label>ساعات التأخير</label>
                <input type="number" id="recDelay" placeholder="">
            </div>
            <div class="input-group">
                <label>مبلغ مسحوب (سلفية)</label>
                <input type="number" id="recWithdrawn" placeholder="">
            </div>
        </div>

        <div class="input-group">
            <label>آخر (ضل من حساب القديم / إضافي عام)</label>
            <input type="text" id="recOther" placeholder="مثال: ضل 2000">
        </div>

        <button type="button" class="btn btn-primary" onclick="saveRecord()">💾 حفظ الحركة</button>

        <div style="margin-top:15px; font-weight:bold; font-size:13px;">السجل اليومي:</div>
        <div id="recordsList" style="max-height:220px; overflow-y:auto; margin-top:8px;"></div>

        <div class="summary" id="summaryBox"></div>
        <button type="button" class="btn btn-primary" style="background:#10b981; margin-top:12px;" onclick="copyReport()">📋 نسخ التقرير</button>
    </div>

    <div id="calView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="hideCal()">⬅ رجوع</button>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button type="button" class="btn btn-secondary" style="width:auto; padding:6px 12px;" onclick="changeMonth(-1)">▶</button>
            <span id="calTitle" style="font-weight:bold; color:#312e81;"></span>
            <button type="button" class="btn btn-secondary" style="width:auto; padding:6px 12px;" onclick="changeMonth(1)">◀</button>
        </div>
        <div class="calendar-grid">
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أحد</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">إثنين</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">ثلاثاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أربعاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">خميس</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">جمعة</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">سبت</div>
        </div>
        <div id="calGrid" class="calendar-grid"></div>
    </div>
</div>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDcQOkPejPSlzOxQixqaQFViLO96QRJo8Q",
      authDomain: "hisapkhatir.firebaseapp.com",
      databaseURL: "https://hisapkhatir-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hisapkhatir",
      storageBucket: "hisapkhatir.firebasestorage.app",
      messagingSenderId: "493775178117",
      appId: "1:493775178117:web:4a2daf8c7f75011f55dcec"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('.info/connected').on('value', function(snap) {
        const statusEl = document.getElementById('connStatus');
        if (snap.val() === true) {
            statusEl.innerHTML = '🟢 متصل بالسحابة (مزامنة فورية)';
            statusEl.style.color = '#16a34a';
            statusEl.style.background = '#dcfce7';
        } else {
            statusEl.innerHTML = '🔴 غير متصل بالسحابة (وضع محلي)';
            statusEl.style.color = '#dc2626';
            statusEl.style.background = '#fee2e2';
        }
    });

    let workers = [];
    let activeIdx = null;
    let calDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];

    function showMsg(msg) {
        let m = document.getElementById('toastMsg');
        if(!m) {
            m = document.createElement('div');
            m.id = 'toastMsg';
            m.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#334155;color:#fff;padding:12px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,0.3);display:none;white-space:nowrap;';
            document.body.appendChild(m);
        }
        m.innerText = msg;
        m.style.display = 'block';
        setTimeout(() => m.style.display = 'none', 2500);
    }

    window.onload = function() {
        db.ref('workers').once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data && Array.isArray(data)) {
                workers = data;
            } else {
                let stored = window.localStorage.getItem('workers_data');
                if (stored) {
                    let parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) workers = parsed;
                }
            }
            document.getElementById('recDate').value = selectedDateStr;
            renderWorkers();
        }).catch(() => {
            let stored = window.localStorage.getItem('workers_data');
            if (stored) {
                let parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) workers = parsed;
            }
            document.getElementById('recDate').value = selectedDateStr;
            renderWorkers();
        });
    };

    function saveData() {
        try {
            window.localStorage.setItem('workers_data', JSON.stringify(workers));
            db.ref('workers').set(workers).then(() => {
                showMsg('تم الحفظ على السحابة');
            }).catch(() => {
                showMsg('تم الحفظ محلياً');
            });
        } catch (e) {
            showMsg('خطأ في حفظ البيانات');
        }
    }

    function exportData() {
        if (workers.length === 0) {
            showMsg('لا يوجد عمال لحفظهم');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workers));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `hisab_backup_${selectedDateStr}.json`);
        dlAnchorElem.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    workers = imported;
                    saveData();
                    renderWorkers();
                    showMsg('تم الاستعادة بنجاح!');
                } else {
                    showMsg('الملف غير صحيح');
                }
            } catch (err) {
                showMsg('خطأ بقراءة الملف');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function showHome() {
        activeIdx = null;
        document.getElementById('addView').classList.add('hidden');
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('calView').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        renderWorkers();
    }

    function showAddWorker() {
        document.getElementById('workerName').value = '';
        document.getElementById('workerSalary').value = '';
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('addView').classList.remove('hidden');
    }

    function saveWorker() {
        const nameField = document.getElementById('workerName');
        const salaryField = document.getElementById('workerSalary');
        const name = nameField.value.trim();
        const salary = parseFloat(salaryField.value) || 0;
        if (!name || salary <= 0) {
            showMsg('اكتب الاسم والراتب');
            return;
        }
        workers.push({ name: name, salary: salary, records: [], other: '' });
        saveData();
        showHome();
        showMsg('تم إضافة العامل');
    }

    function enableEditMode() {
        document.getElementById('displayWorkerInfo').classList.add('hidden');
        document.getElementById('editWorkerInfo').classList.remove('hidden');
    }

    function cancelEditMode() {
        document.getElementById('displayWorkerInfo').classList.remove('hidden');
        document.getElementById('editWorkerInfo').classList.add('hidden');
    }

    function updateWorkerInfo() {
        if (activeIdx === null) return;
        const name = document.getElementById('editWorkerName').value.trim();
        const salary = parseFloat(document.getElementById('editWorkerSalary').value) || 0;
        if (!name || salary <= 0) {
            showMsg('تأكد من الاسم والراتب');
            return;
        }
        workers[activeIdx].name = name;
        workers[activeIdx].salary = salary;
        saveData();
        document.getElementById('pName').innerText = name;
        document.getElementById('pSalary').innerText = `الراتب: ${salary} | اليومية: ${(salary/30).toFixed(1)}`;
        cancelEditMode();
        renderRecords();
        showMsg('تم التحديث');
    }

    function renderWorkers() {
        const list = document.getElementById('workersList');
        list.innerHTML = '';
        if (workers.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:15px;">لا يوجد عمال.</div>';
            return;
        }
        workers.forEach((w, i) => {
            const div = document.createElement('div');
            div.className = 'worker-card';
            div.innerHTML = `
                <div style="flex-grow:1; cursor:pointer;" onclick="openProfile(${i})">
                    <div style="font-weight:bold;">👤 ${w.name}</div>
                    <div style="font-size:11px; color:#64748b; margin-top:3px;">الراتب: ${w.salary}</div>
                </div>
                <button type="button" class="btn-danger" onclick="deleteWorker(event, ${i})">حذف</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteWorker(e, i) {
        e.stopPropagation();
        if (confirm('هل أنت متأكد من حذف هذا العامل؟')) {
            workers.splice(i, 1);
            saveData();
            renderWorkers();
            showMsg('تم الحذف');
        }
    }

    function openProfile(i) {
        activeIdx = i;
        const w = workers[i];
        document.getElementById('pName').innerText = w.name;
        document.getElementById('pSalary').innerText = `الراتب: ${w.salary} | اليومية: ${(w.salary/30).toFixed(1)}`;
        document.getElementById('editWorkerName').value = w.name;
        document.getElementById('editWorkerSalary').value = w.salary;
        cancelEditMode(); 
        document.getElementById('recOther').value = w.other || '';
        document.getElementById('recOT').value = '';
        document.getElementById('recOT2').value = '';
        document.getElementById('recDelay').value = '';
        document.getElementById('recWithdrawn').value = '';
        document.getElementById('recStatus').value = 'present';
        toggleExtra();
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');
        renderRecords();
    }

    function toggleExtra() {
        const s = document.getElementById('recStatus').value;
        const extra = document.getElementById('extraContainer');
        if (s === 'absent') extra.classList.add('hidden');
        else extra.classList.remove('hidden');
    }

    function saveRecord() {
        if (activeIdx === null) return;
        const w = workers[activeIdx];
        if (!w.records) w.records = [];
        const date = document.getElementById('recDate').value;
        const status = document.getElementById('recStatus').value;

        w.records = w.records.filter(r => r.date !== date);
        // If it's present and no extras/withdrawn added, we don't even need to store a record since present is default!
        const ot = parseFloat(document.getElementById('recOT').value) || 0;
        const ot2 = parseFloat(document.getElementById('recOT2').value) || 0;
        const delay = parseFloat(document.getElementById('recDelay').value) || 0;
        const withdrawn = parseFloat(document.getElementById('recWithdrawn').value) || 0;

        if (status === 'present' && ot === 0 && ot2 === 0 && delay === 0 && withdrawn === 0) {
            // Just removing record if it exists since it's normal present day
            w.other = document.getElementById('recOther').value;
            saveData();
            renderRecords();
            showMsg('تم الحفظ (يوم دوام عادي)');
            return;
        }

        w.records.push({
            date: date,
            status: status,
            ot: status === 'absent' ? 0 : ot,
            ot2: status === 'absent' ? 0 : ot2,
            delay: status === 'absent' ? 0 : delay,
            withdrawn: withdrawn
        });
        w.other = document.getElementById('recOther').value;
        w.records.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveData();
        renderRecords();
        showMsg('تم الحفظ');
    }

    function getFormattedDateName(dateStr) {
        const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const d = new Date(dateStr);
        const dayName = daysArr[d.getDay()];
        const parts = dateStr.split('-');
        const formatted = `${parts[2]}.${parts[1]}.${parts[0]}`;
        return `يوم ${dayName} ${formatted}`;
    }

    function generateReportText() {
        const w = workers[activeIdx];
        const recs = w.records || [];
        let absentTot = 0, otTot = 0, ot2Tot = 0, delayTot = 0, withTot = 0;
        let delayDates = [], absentDates = [];
        
        recs.forEach(r => {
            if (r.status === 'absent') {
                absentTot++;
                absentDates.push(getFormattedDateName(r.date));
            } else {
                if ((r.delay || 0) > 0) {
                    delayTot += r.delay;
                    delayDates.push(getFormattedDateName(r.date));
                }
            }
            otTot += (r.ot || 0);
            ot2Tot += (r.ot2 || 0);
            withTot += (r.withdrawn || 0);
        });

        const days = 30 - absentTot;
        const daily = w.salary / 30;
        const hourly = daily / 9;
        const earnedDays = days * daily;
        const earnedOt = otTot * hourly * 1.5;
        const earnedOt2 = ot2Tot * hourly * 2;
        const cutDelay = delayTot * hourly;
        const cutAbsence = absentTot * daily;
        
        let otherVal = 0;
        if (w.other && w.other.trim() !== '') {
            const match = w.other.match(/-?\d+(\.\d+)?/);
            otherVal = match ? parseFloat(match[0]) : 0;
        }

        const net = earnedDays + earnedOt + earnedOt2 - cutDelay - withTot + otherVal;

        let txt = `📊 تقرير تفاصيل الراتب\n`;
        txt += `👤 اسم العامل: ${w.name}\n`;
        txt += `💰 الراتب الشهري: ${w.salary} ليرة\n`;
        txt += `-------------------\n`;
        txt += `📅 كم يوم مداوم (${days} يوم): ${earnedDays.toFixed(2)} ليرة\n`;
        
        if (otTot > 0 || ot2Tot > 0) {
            txt += `-------------------\n`;
            if (otTot > 0) txt += `➕ إضافي 1.5 (${otTot} ساعة): +${earnedOt.toFixed(2)} ليرة\n`;
            if (ot2Tot > 0) txt += `➕ إضافي 2x (${ot2Tot} ساعة): +${earnedOt2.toFixed(2)} ليرة\n`;
        }
        
        if (delayTot > 0) {
            txt += `-------------------\n`;
            txt += `➖ التأخير (${delayTot} ساعة): -${cutDelay.toFixed(2)} ليرة\n`;
            txt += `📌 تواريخ التأخير: ${delayDates.join(' - ')}\n`;
        }
        
        if (absentTot > 0) {
            txt += `-------------------\n`;
            txt += `➖ الغياب (${absentTot} يوم): -${cutAbsence.toFixed(2)} ليرة\n`;
            txt += `📌 تواريخ الغياب: ${absentDates.join(' - ')}\n`;
        }
        
        if (withTot > 0) {
            txt += `-------------------\n`;
            txt += `➖ ساحب: -${withTot.toFixed(2)} ليرة\n`;
        }
        
        if (w.other && w.other.trim() !== '') {
            txt += `-------------------\n`;
            txt += `➕ آخر (${w.other}): ${otherVal >= 0 ? '+' : ''}${otherVal} ليرة\n`;
        }
        
        txt += `-------------------\n`;
        txt += `💰 المجموع الكامل: ${net.toFixed(2)} ليرة`;
        return txt;
    }

    function renderRecords() {
        const list = document.getElementById('recordsList');
        const summary = document.getElementById('summaryBox');
        list.innerHTML = '';
        const w = workers[activeIdx];
        const recs = w.records || [];
        
        if (recs.length === 0 && (!w.other || w.other.trim() === '')) {
            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:11px;">لا توجد حركات مسجلة (كل الأيام دوام افتراضي).</div>';
            summary.innerHTML = generateReportText();
            return;
        }
        const daily = w.salary / 30;
        const hourly = daily / 9;
        recs.forEach((r, idx) => {
            let stTxt = r.status === 'present' ? 'إضافات / تعديل' : 'غائب';
            let dayTotal = 0;
            let details = [];
            if (r.status === 'present') {
                let otEarn = ((r.ot || 0) * hourly * 1.5) + ((r.ot2 || 0) * hourly * 2);
                let delayCut = (r.delay || 0) * hourly;
                let withAmt = (r.withdrawn || 0);
                dayTotal = daily + otEarn - delayCut - withAmt;
                if ((r.ot || 0) > 0) details.push(`إضافي 1.5: ${r.ot} س`);
                if ((r.ot2 || 0) > 0) details.push(`إضافي 2x: ${r.ot2} س`);
                if ((r.delay || 0) > 0) details.push(`تأخير: ${r.delay} س`);
                if (withAmt > 0) details.push(`ساحب: ${withAmt}`);
                if (details.length === 0) details.push(`يوم دوام عادي`);
            } else { 
                dayTotal = -daily; 
                details.push(`غياب`); 
            }
            let detailsStr = details.length > 0 ? `<div style="margin-top:4px; font-size:11px; color:#475569; line-height:1.5;">${details.join(' | ')}</div>` : '';
            const div = document.createElement('div');
            div.className = 'day-box';
            div.innerHTML = `
                <div style="flex-grow:1;">
                    <b>${r.date}</b> (${stTxt}) — <span style="color:#4f46e5; font-weight:bold;">${dayTotal.toFixed(2)} ليرة</span>
                    ${detailsStr}
                </div>
                <button type="button" class="btn-danger" onclick="deleteRec(${idx})">حذف</button>
            `;
            list.appendChild(div);
        });
        summary.innerText = generateReportText();
    }

    function deleteRec(idx) {
        if (confirm('هل أنت متأكد من حذف هذه الحركة؟')) {
            workers[activeIdx].records.splice(idx, 1);
            saveData();
            renderRecords();
            showMsg('تم الحذف');
        }
    }

    function showCal() {
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('calView').classList.remove('hidden');
        renderCalendar();
    }

    function hideCal() {
        document.getElementById('calView').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');
    }

    function changeMonth(dir) {
        calDate.setMonth(calDate.getMonth() + dir);
        renderCalendar();
    }

    function renderCalendar() {
        const y = calDate.getFullYear();
        const m = calDate.getMonth();
        const mNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        document.getElementById('calTitle').innerText = `${mNames[m]} ${y}`;
        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';
        const recsMap = {};
        if (workers[activeIdx].records) {
            workers[activeIdx].records.forEach(r => recsMap[r.date] = r.status);
        }
        for (let i = 0; i < firstDay; i++) { grid.appendChild(document.createElement('div')); }
        for (let d = 1; d <= totalDays; d++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'cal-day';
            dayDiv.innerText = d;
            const mStr = String(m + 1).padStart(2, '0');
            const dStr = String(d).padStart(2, '0');
            const dKey = `${y}-${mStr}-${dStr}`;
            
            const status = recsMap[dKey] || 'present';
            if (status === 'absent') {
                dayDiv.classList.add('absent');
            }

            dayDiv.onclick = function() {
                selectedDateStr = dKey;
                document.getElementById('recDate').value = dKey;
                document.getElementById('recStatus').value = 'present';
                document.getElementById('recOT').value = '';
                document.getElementById('recOT2').value = '';
                document.getElementById('recDelay').value = '';
                document.getElementById('recWithdrawn').value = '';
                toggleExtra();
                hideCal();
            };
            grid.appendChild(dayDiv);
        }
    }

    function copyReport() {
        if (activeIdx === null) return;
        const text = generateReportText();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showMsg('تم النسخ'));
        } else {
            showMsg('النسخ التلقائي ما اشتغل');
        }
    }
</script>
</body>
</html>
