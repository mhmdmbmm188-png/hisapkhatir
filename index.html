<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>سجل العمال والرواتب - محمد المرعي</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', Tahoma, Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #1e293b;
        }

        .app {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        h2 {
            color: #312e81;
            font-size: 22px;
            font-weight: 800;
        }

        .developer-tag {
            font-size: 12px;
            color: #6366f1;
            font-weight: 700;
            margin-top: 2px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .btn-primary:hover { background: #4338ca; }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .worker-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .worker-card:hover {
            border-color: #6366f1;
            background: #fff;
        }

        .worker-info span { display: block; }

        .worker-name {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }

        .worker-salary {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-top: 2px;
        }

        .input-group { margin-bottom: 10px; }

        label {
            display: block;
            margin-bottom: 4px;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: #fff;
        }

        /* تنسيق حقل التاريخ لتوضيح الأيام المسجلة */
        input[type="date"] {
            position: relative;
        }

        .day-record-box {
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .day-record-header {
            font-weight: 800;
            color: #312e81;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .summary-box {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            padding: 14px;
            border-radius: 14px;
            margin-top: 14px;
        }

        .summary-box div {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 700;
        }

        .summary-total {
            font-size: 16px !important;
            font-weight: 800 !important;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 6px;
            margin-top: 6px;
        }

        .period-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .period-title {
            font-weight: 800;
            color: #3730a3;
            font-size: 13px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #c7d2fe;
            padding-bottom: 2px;
        }

        /* نافذة التقويم المخصصة لتلوين الأيام المسجلة بالأخضر */
        .custom-calendar-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .calendar-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .cal-day-name {
            font-size: 12px;
            font-weight: 800;
            color: #64748b;
            padding-bottom: 6px;
        }
        .cal-day {
            padding: 10px 0;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #1e293b;
        }
        .cal-day.recorded {
            background: #22c55e !important; /* لون أخضر للأيام المسجلة */
            color: white !important;
        }
        .cal-day.selected {
            border: 2px solid #4f46e5;
        }
        .cal-day.empty {
            background: transparent;
            cursor: default;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>

<div class="app">
    <div class="app-header">
        <h2>سجل العمال والرواتب</h2>
        <div class="developer-tag">إعداد: محمد المرعي</div>
    </div>

    <!-- واجهة قائمة العمال الرئيسية -->
    <div id="mainHomeView">
        <div class="section-title">
            <span>قائمة العمال</span>
        </div>
        <button class="btn-primary" onclick="openAddWorkerModal()">➕ إضافة عامل جديد</button>
        <div id="workersListContainer" style="max-height: 380px; overflow-y: auto; margin-top: 8px;"></div>
    </div>

    <!-- واجهة ملف العامل الشخصي واليوميات -->
    <div id="workerProfileView" class="hidden">
        <button class="btn-secondary" onclick="backToHome()">⬅ العودة للقائمة</button>
        
        <div style="margin-top: 10px; background: #e0e7ff; padding: 10px; border-radius: 12px; text-align: center;">
            <div id="profileWorkerName" style="font-size: 15px; font-weight: 800; color: #312e81;"></div>
            <div id="profileWorkerSalary" style="font-size: 12px; color: #4338ca; font-weight: 700;"></div>
        </div>

        <div style="margin-top: 10px; border-top: 2px solid #f1f5f9; padding-top: 8px;">
            <div class="section-title" style="font-size:13px;">تسجيل حركة يومية</div>
            
            <div class="input-group">
                <label>التاريخ (اضغط لاختيار اليوم ومعرفة المسجل)</label>
                <input type="text" id="recordDateDisplay" readonly onclick="openCalendarModal()" style="cursor: pointer; background: #fff; text-align: center; font-weight: 800; color: #4f46e5;">
                <input type="hidden" id="recordDate" onchange="checkAutoWeekend()">
            </div>

            <div class="input-group">
                <label>حالة الدوام (السبت والأحد عطلة تلقائية)</label>
                <select id="recordStatus" onchange="toggleRecordFields()">
                    <option value="present">داوم (كامل)</option>
                    <option value="absent">غائب</option>
                    <option value="weekend">عطلة رسمية (سبت/أحد)</option>
                </select>
            </div>

            <div id="extraFieldsContainer">
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعة ونصف)</label>
                    <input type="number" id="recordOvertime" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعتين)</label>
                    <input type="number" id="recordOvertimeDouble" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات التأخير</label>
                    <input type="number" id="recordDelay" value="0">
                </div>
                <div class="input-group">
                    <label>مبلغ مسحوب (سلفية / سحب)</label>
                    <input type="number" id="recordWithdrawn" value="0">
                </div>
            </div>

            <button class="btn-primary" onclick="saveDayRecord()">💾 حفظ حركة هذا اليوم</button>
        </div>

        <div style="margin-top: 5px;">
            <div class="section-title" style="font-size:13px;">سجل الأيام المسجلة</div>
            <div id="workerDaysList" style="max-height: 150px; overflow-y: auto;"></div>
        </div>

        <div class="summary-box" id="workerFinancialSummary"></div>
    </div>
</div>

<!-- نافذة إضافة عامل جديد -->
<div id="addWorkerModal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding: 20px; z-index: 1000;">
    <div style="background:white; padding:20px; border-radius:20px; width:100%; max-width:380px;">
        <div class="section-title">إضافة عامل جديد</div>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="newWorkerName" placeholder="أدخل اسم العامل">
        </div>
        <div class="input-group">
            <label>الراتب الشهري الأساسي</label>
            <input type="number" id="newWorkerSalary" placeholder="أدخل الراتب">
        </div>
        <button class="btn-primary" onclick="addNewWorker()">حفظ العامل</button>
        <button class="btn-secondary" onclick="closeAddWorkerModal()" style="width:100%; margin-top:4px;">إلغاء</button>
    </div>
</div>

<!-- نافذة التقويم المخصص لتلوين الأيام المسجلة بالأخضر -->
<div id="calendarModal" class="custom-calendar-modal hidden">
    <div class="calendar-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button class="btn-secondary" onclick="changeCalendarMonth(-1)">▶</button>
            <span id="calMonthYearTitle" style="font-weight: 800; color: #312e81; font-size: 15px;"></span>
            <button class="btn-secondary" onclick="changeCalendarMonth(1)">◀</button>
        </div>
        <div class="calendar-grid">
            <div class="cal-day-name">أحد</div>
            <div class="cal-day-name">إثنين</div>
            <div class="cal-day-name">ثلاثاء</div>
            <div class="cal-day-name">أربعاء</div>
            <div class="cal-day-name">خميس</div>
            <div class="cal-day-name">جمعة</div>
            <div class="cal-day-name">سبت</div>
        </div>
        <div id="calDaysContainer" class="calendar-grid" style="margin-top: 6px;"></div>
        <button class="btn-secondary" onclick="closeCalendarModal()" style="width: 100%; margin-top: 14px;">إغلاق</button>
    </div>
</div>

<script>
let workers = JSON.parse(localStorage.getItem('my_workers_data')) || [];
let activeWorkerId = null;
let calCurrentDate = new Date();

// ضبط تاريخ اليوم افتراضياً
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('recordDate').value = todayStr;
updateDateDisplay(todayStr);

function saveData() {
    localStorage.setItem('my_workers_data', JSON.stringify(workers));
}

function updateDateDisplay(dateStr) {
    document.getElementById('recordDateDisplay').value = dateStr;
}

function getDayNameAndDateStr(dateString) {
    const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const d = new Date(dateString);
    const dayName = daysArr[d.getDay()];
    return { dayName, dayOfWeek: d.getDay() };
}

function checkAutoWeekend() {
    const dateVal = document.getElementById('recordDate').value;
    if (!dateVal) return;
    const { dayOfWeek } = getDayNameAndDateStr(dateVal);
    const statusSelect = document.getElementById('recordStatus');
    
    if (dayOfWeek === 0 || dayOfWeek === 6) {
        statusSelect.value = 'weekend';
    } else {
        statusSelect.value = 'present';
    }
    toggleRecordFields();
}

function renderWorkersList() {
    const container = document.getElementById('workersListContainer');
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px; padding:20px;">لا يوجد عمال مضافين حالياً.</div>';
        return;
    }

    workers.forEach((worker, index) => {
        const card = document.createElement('div');
        card.className = 'worker-card';
        card.innerHTML = `
            <div class="worker-info" onclick="openWorkerProfile(${index})">
                <span class="worker-name">👤 ${worker.name}</span>
                <span class="worker-salary">الراتب: ${worker.salary} ليرة (على 30 يوم)</span>
            </div>
            <div>
                <button class="btn-danger" onclick="deleteWorker(event, ${index})">حذف</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function openAddWorkerModal() {
    document.getElementById('newWorkerName').value = '';
    document.getElementById('newWorkerSalary').value = '';
    document.getElementById('addWorkerModal').classList.remove('hidden');
}

function closeAddWorkerModal() {
    document.getElementById('addWorkerModal').classList.add('hidden');
}

function addNewWorker() {
    const name = document.getElementById('newWorkerName').value.trim();
    const salary = parseFloat(document.getElementById('newWorkerSalary').value) || 0;

    if (!name || salary <= 0) {
        alert('الرجاء إدخال اسم العامل والراتب الصحيح');
        return;
    }

    workers.push({ name: name, salary: salary, records: [] });
    saveData();
    closeAddWorkerModal();
    renderWorkersList();
}

function deleteWorker(event, index) {
    event.stopPropagation();
    if (confirm('هل أنت متأكد من حذف هذا العامل وكل سجله؟')) {
        workers.splice(index, 1);
        saveData();
        renderWorkersList();
    }
}

function openWorkerProfile(index) {
    activeWorkerId = index;
    const worker = workers[index];
    
    document.getElementById('profileWorkerName').innerText = worker.name;
    document.getElementById('profileWorkerSalary').innerText = `الراتب الشهري: ${worker.salary} ليرة | اليومية: ${(worker.salary/30).toFixed(1)} ليرة`;
    
    document.getElementById('mainHomeView').classList.add('hidden');
    document.getElementById('workerProfileView').classList.remove('hidden');
    
    document.getElementById('recordDate').value = todayStr;
    updateDateDisplay(todayStr);
    checkAutoWeekend();
    renderWorkerDays();
}

function backToHome() {
    activeWorkerId = null;
    document.getElementById('workerProfileView').classList.add('hidden');
    document.getElementById('mainHomeView').classList.remove('hidden');
    renderWorkersList();
}

function toggleRecordFields() {
    const status = document.getElementById('recordStatus').value;
    const extraFields = document.getElementById('extraFieldsContainer');
    if (status === 'absent' || status === 'weekend') {
        extraFields.classList.add('hidden');
    } else {
        extraFields.classList.remove('hidden');
    }
}

// إدارة التقويم المخصص وتلوين الأيام المسجلة
function openCalendarModal() {
    document.getElementById('calendarModal').classList.remove('hidden');
    renderCustomCalendar();
}

function closeCalendarModal() {
    document.getElementById('calendarModal').classList.add('hidden');
}

function changeCalendarMonth(direction) {
    calCurrentDate.setMonth(calCurrentDate.getMonth() + direction);
    renderCustomCalendar();
}

function renderCustomCalendar() {
    const year = calCurrentDate.getFullYear();
    const month = calCurrentDate.getMonth();
    
    const monthsNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    document.getElementById('calMonthYearTitle').innerText = `${monthsNames[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    
    const container = document.getElementById('calDaysContainer');
    container.innerHTML = '';

    const worker = workers[activeWorkerId];
    const recordedDatesSet = new Set(worker.records.map(r => r.date));
    const selectedDate = document.getElementById('recordDate').value;

    // الفراغات قبل بداية الشهر
    for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'cal-day empty';
        container.appendChild(emptyDiv);
    }

    // أيام الشهر
    for (let d = 1; d <= totalDays; d++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day';
        dayDiv.innerText = d;

        const mFormatted = String(month + 1).padStart(2, '0');
        const dFormatted = String(d).padStart(2, '0');
        const currentDateStr = `${year}-${mFormatted}-${dFormatted}`;

        // إذا كان اليوم مسجلاً مسبقاً، يصبح لونه أخضر
        if (recordedDatesSet.has(currentDateStr)) {
            dayDiv.classList.add('recorded');
        }

        if (currentDateStr === selectedDate) {
            dayDiv.classList.add('selected');
        }

        dayDiv.onclick = function() {
            document.getElementById('recordDate').value = currentDateStr;
            updateDateDisplay(currentDateStr);
            checkAutoWeekend();
            closeCalendarModal();
        };

        container.appendChild(dayDiv);
    }
}

function saveDayRecord() {
    const date = document.getElementById('recordDate').value;
    const status = document.getElementById('recordStatus').value;
    
    if (!date) {
        alert('الرجاء اختيار التاريخ');
        return;
    }

    const overtime = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertime').value) || 0);
    const overtimeDouble = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertimeDouble').value) || 0);
    const delay = status === 'w
