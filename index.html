<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>حاسبة الرواتب - محمد المرعي</title>
    
    <!-- مكتبات Firebase للربط السحابي -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', Tahoma, Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #1e293b;
        }

        .app {
            background: #ffffff;
            padding: 22px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        h2 {
            color: #312e81;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .developer-tag {
            font-size: 13px;
            color: #6366f1;
            font-weight: 700;
            margin-top: 2px;
        }

        #syncStatus {
            text-align: center;
            font-size: 11px;
            padding: 5px;
            border-radius: 8px;
            margin-top: 8px;
            font-weight: 700;
            background: #f1f5f9;
            color: #64748b;
        }

        .workers-list-section {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
        }

        .worker-card-mini {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
        }

        input:focus {
            border-color: #6366f1;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .dynamic-fields-container {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dynamic-input {
            padding: 9px 12px;
            font-size: 12px;
            border: 1.5px dashed #cbd5e1;
            border-radius: 10px;
            background: #f1f5f9;
            width: 100%;
        }

        .row-inputs {
            display: flex;
            gap: 8px;
        }

        .row-inputs input {
            flex: 1;
        }

        #captureArea {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            margin-top: 18px;
            display: none;
            border: 2px solid #e0e7ff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.06);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            color: #475569;
            border-bottom: 1px dashed #e2e8f0;
            font-weight: 600;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item span:nth-child(2) {
            font-weight: 800;
            color: #0f172a;
        }

        .sub-dates-text {
            font-size: 11px;
            color: #dc2626;
            margin-top: -4px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .final-result {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            padding: 14px 16px;
            margin-top: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
        }

        .dev-footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 10px;
            font-weight: 600;
        }

        .buttons-container {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #059669;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .btn-action:hover {
            background: #047857;
        }

        .btn-cloud {
            background: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-cloud:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>
<div class="app">
    <div class="app-header">
        <h2>حاسبة الرواتب</h2>
        <div class="developer-tag">تصميم وتطوير: محمد المرعي</div>
        <div id="syncStatus">🔄 جاري الاتصال بالسحابة...</div>
    </div>

    <!-- قائمة العمال المحفوظين بالسحابة -->
    <div class="workers-list-section">
        <label>العمال المحفوظين في السحابة</label>
        <div id="savedWorkersContainer">جاري جلب القائمة...</div>
        <button class="btn-action btn-cloud" style="margin-top: 8px; padding: 10px; font-size: 13px;" onclick="saveCurrentToCloud()">☁ حفظ هذا العامل بالسحابة</button>
    </div>

    <div id="inputFormArea">
        <div class="input-group">
            <label>اسم العامل</label>
            <input id="employeeName" placeholder="أدخل اسم العامل" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>الراتب الشهري</label>
            <input id="salary" type="number" placeholder="أدخل الراتب" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>أيام الدوام</label>
            <input id="workDays" type="number" placeholder="عدد أيام الدوام" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>إضافي ساعة بساعة ونصف</label>
            <input id="overtime" type="number" placeholder="عدد الساعات" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>إضافي ساعة بساعتين</label>
            <input id="overtimeDouble" type="number" placeholder="عدد الساعات" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>التأخير (بالساعات)</label>
            <input id="delay" type="number" placeholder="عدد الساعات" oninput="updateDynamicInputs(); calculate();">
            <div id="delayDates" class="dynamic-fields-container"></div>
        </div>
        <div class="input-group">
            <label>الغياب (بالأيام)</label>
            <input id="absence" type="number" placeholder="عدد الأيام" oninput="updateDynamicInputs(); calculate();">
            <div id="absenceDates" class="dynamic-fields-container"></div>
        </div>
        <div class="input-group">
            <label>ساحب</label>
            <input id="withdrawn" type="number" placeholder="المبلغ المسحوب" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>آخر</label>
            <div class="row-inputs">
                <input id="oldBalanceReason" placeholder="السبب (مثال: ضل له من حساب القديم)" oninput="calculate()">
                <input id="oldBalanceAmount" type="number" placeholder="المبلغ" oninput="calculate()">
            </div>
        </div>
    </div>

    <div id="captureArea">
        <div style="text-align: center; margin-bottom: 10px;">
            <div style="font-size: 16px; font-weight: 800; color: #312e81;">تقرير تفاصيل الراتب</div>
            <div style="font-size: 11px; color: #6366f1; font-weight: 700;">إعداد: محمد المرعي</div>
        </div>
        <div class="results" id="resultsContent"></div>
        <div class="dev-footer">تم الاصدار عبر تطبيق محمد المرعي</div>
    </div>

    <div class="buttons-container">
        <button class="btn-action" onclick="copyReport()">📋 نسخ تقرير الراتب لإرساله</button>
    </div>
</div>

<script>
    // إعدادات اتصال Firebase السحابي
    const firebaseConfig = {
        apiKey: "AIzaSyDcQOkPejPSlzOxQixqaQFViLO96QRJo8Q",
        authDomain: "hisapkhatir.firebaseapp.com",
        databaseURL: "https://hisapkhatir-default-rtdb.firebaseio.com",
        projectId: "hisapkhatir",
        storageBucket: "hisapkhatir.firebasestorage.app",
        messagingSenderId: "493775178117",
        appId: "1:493775178117:web:4a2daf8c7f75011f55dcec"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('workers_salaries_list');
    let cloudWorkersData = {};

    const statusEl = document.getElementById('syncStatus');

    function updateStatus(text, type) {
        statusEl.innerText = text;
        if (type === 'success') {
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#166534';
        } else if (type === 'error') {
            statusEl.style.background = '#fee2e2';
            statusEl.style.color = '#991b1b';
        } else {
            statusEl.style.background = '#f1f5f9';
            statusEl.style.color = '#64748b';
        }
    }

    function initCloudSync() {
        updateStatus('🔄 جاري الاتصال بالسحابة...', 'loading');
        dbRef.on('value', (snapshot) => {
            cloudWorkersData = snapshot.val() || {};
            renderSavedWorkersList();
            updateStatus('✅ متصل بالسحابة بنجاح', 'success');
        }, (error) => {
            updateStatus('❌ خطأ اتصال بالسحابة: ' + error.message, 'error');
        });
    }

    initCloudSync();

    function renderSavedWorkersList() {
        const container = document.getElementById('savedWorkersContainer');
        container.innerHTML = '';
        const keys = Object.keys(cloudWorkersData);

        if (keys.length === 0) {
            container.innerHTML = '<div style="font-size: 11px; color: #64748b; text-align: center;">لا توجد بيانات محفوظة بالسحابة بعد</div>';
            return;
        }

        keys.forEach(name => {
            const card = document.createElement('div');
            card.className = 'worker-card-mini';
            card.innerHTML = `
                <span>👤 ${name}</span>
                <div>
                    <button style="background: #4f46e5; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px;" onclick="loadWorker('${name}')">استعراض</button>
                    <button style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; margin-right: 4px;" onclick="deleteWorker('${name}')">حذف</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function saveCurrentToCloud() {
        let name = document.getElementById('employeeName').value.trim();
        
        if (!name) {
            alert('الرجاء إدخال اسم العامل أولاً لحفظه بالسحابة');
            return;
        }
        
        // إصلاح: منع الرموز الممنوعة في فايربيس (تسبب تعطل التطبيق)
        name = name.replace(/[.#$\[\]]/g, '_');
        document.getElementById('employeeName').value = name;

        const dataToSave = {
            salary: document.getElementById('salary').value,
            workDays: document.getElementById('workDays').value,
            overtime: document.getElementById('overtime').value,
            overtimeDouble: document.getElementById('overtimeDouble').value,
            delay: document.getElementById('delay').value,
            delayDates: getSubValues('delayDates'),
            absence: document.getElementById('absence').value,
            absenceDates: getSubValues('absenceDates'),
            withdrawn: document.getElementById('withdrawn').value,
            oldBalanceAmount: document.getElementById('oldBalanceAmount').value,
            oldBalanceReason: document.getElementById('oldBalanceReason').value
        };

        updateStatus('💾 جاري حفظ البيانات بالسحابة...', 'loading');
        dbRef.child(name).set(dataToSave).then(() => {
            updateStatus('✅ تم الحفظ بالسحابة بنجاح', 'success');
            alert(`✅ تم حفظ بيانات العامل (${name}) في السحابة بنجاح!`);
        }).catch(err => {
            updateStatus('❌ فشل الحفظ: ' + err.message, 'error');
            alert('فشل الحفظ: ' + err.message);
        });
    }

    function loadWorker(name) {
        const data = cloudWorkersData[name];
        if (!data) return;

        document.getElementById('employeeName').value = name;
        document.getElementById('salary').value = data.salary || '';
        document.getElementById('workDays').value = data.workDays || '';
        document.getElementById('overtime').value = data.overtime || '';
        document.getElementById('overtimeDouble').value = data.overtimeDouble || '';
        
        document.getElementById('delay').value = data.delay || '';
        updateDynamicInputs(); // إنشاء الحقول فارغة بناءً على الرقم
        if(data.delayDates) {
            const delayInputs = document.querySelectorAll('#delayDates input');
            data.delayDates.forEach((val, idx) => { if(delayInputs[idx]) delayInputs[idx].value = val; });
        }

        document.getElementById('absence').value = data.absence || '';
        updateDynamicInputs();
        if(data.absenceDates) {
            const absenceInputs = document.querySelectorAll('#absenceDates input');
            data.absenceDates.forEach((val, idx) => { if(absenceInputs[idx]) absenceInputs[idx].value = val; });
        }

        document.getElementById('withdrawn').value = data.withdrawn || '';
        document.getElementById('oldBalanceAmount').value = data.oldBalanceAmount || '';
        document.getElementById('oldBalanceReason').value = data.oldBalanceReason || '';

        calculate();
        
        // إصلاح: التمرير لأعلى الشاشة بعد التحميل (مهم للموبايل)
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.loadWorker = loadWorker;

    function deleteWorker(name) {
        if(confirm(`هل أنت متأكد من حذف بيانات العامل (${name}) من السحابة؟`)) {
            dbRef.child(name).remove().then(() => {
                alert('✅ تم الحذف بنجاح');
            });
        }
    }
    window.deleteWorker = deleteWorker;

    function updateDynamicInputs() {
        renderSubInputs('delay', 'delayDates', 'تاريخ وساعة التأخير');
        renderSubInputs('absence', 'absenceDates', 'تاريخ الغياب');
    }

    function renderSubInputs(countId, containerId, placeholderText) {
        const count = parseInt(document.getElementById(countId).value) || 0;
        const container = document.getElementById(containerId);
        
        const existingValues = [];
        container.querySelectorAll('input').forEach(input => existingValues.push(input.value));

        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'dynamic-input';
            input.placeholder = `${placeholderText} ${i + 1}`;
            input.value = existingValues[i] || '';
            input.oninput = calculate;
            container.appendChild(input);
        }
    }

    function getSubValues(containerId) {
        const container = document.getElementById(containerId);
        const values = [];
        if(container) {
            container.querySelectorAll('input').forEach(input => {
                if (input.value.trim() !== '') values.push(input.value.trim());
            });
        }
        return values;
    }

    function calculate() {
        const employeeName = document.getElementById('employeeName').value.trim();
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const workDays = parseFloat(document.getElementById('workDays').value) || 0;
        const overtime = parseFloat(document.getElementById('overtime').value) || 0;
        const overtimeDouble = parseFloat(document.getElementById('overtimeDouble').value) || 0;
        const delay = parseFloat(document.getElementById('delay').value) || 0;
        const absence = parseFloat(document.getElementById('absence').value) || 0;
        const withdrawn = parseFloat(document.getElementById('withdrawn').value) || 0;
        const oldBalanceAmount = parseFloat(document.getElementById('oldBalanceAmount').value) || 0;
        const oldBalanceReason = document.getElementById('oldBalanceReason').value.trim();

        const delayDates = getSubValues('delayDates');
        const absenceDates = getSubValues('absenceDates');

        const resultsBox = document.getElementById('resultsContent');
        const captureArea = document.getElementById('captureArea');

        if (salary === 0 && workDays === 0) {
            captureArea.style.display = 'none';
            return;
        }

        captureArea.style.display = 'block';

        const daily = salary / 30;
        const hourly = daily / 9;
        const rate15 = hourly * 1.5;
        const rate2 = hourly * 2;

        const totalWorkDaysAmount = daily * workDays;
        const totalOvertime15 = overtime * rate15;
        const totalOvertime2 = overtimeDouble * rate2;
        const totalDelayCut = delay * hourly;
        const totalAbsenceCut = absence * daily;

        const netTotal = totalWorkDaysAmount + totalOvertime15 + totalOvertime2 - totalDelayCut - totalAbsenceCut - withdrawn + oldBalanceAmount;

        let htmlContent = '';
        if (employeeName !== '') {
            htmlContent += `<div class="result-item" style="color:#4f46e5; font-size:14px; font-weight:800; border-bottom: 2px solid #e0e7ff; padding-bottom: 6px;"><span>اسم العامل:</span><span>${employeeName}</span></div>`;
        }

        htmlContent += `
            <div class="result-item"><span>الراتب الشهري:</span><span>${salary} ليرة</span></div>
            <div class="result-item"><span>كم يوم مداوم (${workDays} يوم):</span><span>${totalWorkDaysAmount.toFixed(2)} ليرة</span></div>
        `;

        if (overtime > 0) {
            htmlContent += `<div class="result-item"><span>إضافي (1.5x) (${overtime} ساعة):</span><span>+ ${totalOvertime15.toFixed(2)} ليرة</span></div>`;
        }
        if (overtime
