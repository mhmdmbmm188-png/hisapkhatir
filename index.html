<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>سجل العمال والرواتب - محمد المرعي</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', Tahoma, Arial, sans-serif; }

        body {
            background: #0f172a;
            min-height: 100vh;
            padding: 12px;
            color: #1e293b;
        }

        .app {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .app-header {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        h2 {
            color: #312e81;
            font-size: 20px;
            font-weight: 800;
        }

        .developer-tag {
            font-size: 11px;
            color: #6366f1;
            font-weight: 700;
            margin-top: 2px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .worker-card {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .worker-name {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
        }

        .worker-salary {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            margin-top: 2px;
        }

        .input-group { margin-bottom: 8px; }

        label {
            display: block;
            margin-bottom: 3px;
            color: #334155;
            font-size: 11px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 9px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
        }

        .day-record-box {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .day-record-header {
            font-weight: 800;
            color: #312e81;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .summary-box {
            background: #4f46e5;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .summary-box div {
            margin-bottom: 3px;
            font-size: 12px;
            font-weight: 700;
        }

        .summary-total {
            font-size: 14px !important;
            font-weight: 800 !important;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 5px;
            margin-top: 5px;
        }

        .period-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .period-title {
            font-weight: 800;
            color: #3730a3;
            font-size: 12px;
            margin-bottom: 3px;
        }

        /* تصميم النوافذ المنبثقة المتوافقة تماماً مع التطبيق */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 9999;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .cal-day-name {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-align: center;
            padding-bottom: 4px;
        }
        .cal-day {
            padding: 8px 0;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            color: #1e293b;
        }
        .cal-day.recorded-present { background: #22c55e !important; color: white !important; }
        .cal-day.recorded-absent { background: #dc2626 !important; color: white !important; }
        .cal-day.recorded-weekend { background: #64748b !important; color: white !important; }
        .cal-day.selected { border: 2px solid #1e293b; }
        .cal-day.empty { background: transparent; cursor: default; }

        .hidden { display: none !important; }
    </style>
</head>

<body>

<div class="app">
    <div class="app-header">
        <h2>سجل العمال والرواتب</h2>
        <div class="developer-tag">إعداد: محمد المرعي</div>
    </div>

    <!-- واجهة قائمة العمال الرئيسية -->
    <div id="mainHomeView">
        <div class="section-title">قائمة العمال</div>
        <button class="btn-primary" onclick="openAddWorkerModal()">➕ إضافة عامل جديد</button>
        <div id="workersListContainer" style="max-height: 320px; overflow-y: auto; margin-top: 6px;"></div>
    </div>

    <!-- واجهة ملف العامل الشخصي واليوميات -->
    <div id="workerProfileView" class="hidden">
        <button class="btn-secondary" onclick="backToHome()" style="margin-bottom: 8px;">⬅ العودة للقائمة</button>
        
        <div style="background: #e0e7ff; padding: 8px; border-radius: 10px; text-align: center; margin-bottom: 8px;">
            <div id="profileWorkerName" style="font-size: 14px; font-weight: 800; color: #312e81;"></div>
            <div id="profileWorkerSalary" style="font-size: 11px; color: #4338ca; font-weight: 700;"></div>
        </div>

        <div style="border-top: 1.5px solid #f1f5f9; padding-top: 6px;">
            <div class="section-title" style="font-size:12px;">تسجيل حركة يومية</div>
            
            <div class="input-group">
                <label>التاريخ (اضغط لاختيار اليوم)</label>
                <input type="text" id="recordDateDisplay" readonly onclick="openCalendarModal()" style="cursor: pointer; background: #fff; text-align: center; font-weight: 800; color: #4f46e5;">
                <input type="hidden" id="recordDate" onchange="checkAutoWeekend()">
            </div>

            <div class="input-group">
                <label>حالة الدوام (السبت والأحد عطلة تلقائية)</label>
                <select id="recordStatus" onchange="toggleRecordFields()">
                    <option value="present">داوم (كامل)</option>
                    <option value="absent">غائب</option>
                    <option value="weekend">عطلة رسمية (سبت/أحد)</option>
                </select>
            </div>

            <div id="extraFieldsContainer">
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعة ونصف)</label>
                    <input type="number" id="recordOvertime" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعتين)</label>
                    <input type="number" id="recordOvertimeDouble" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات التأخير</label>
                    <input type="number" id="recordDelay" value="0">
                </div>
                <div class="input-group">
                    <label>مبلغ مسحوب (سلفية / سحب)</label>
                    <input type="number" id="recordWithdrawn" value="0">
                </div>
            </div>

            <button class="btn-primary" onclick="saveDayRecord()">💾 حفظ حركة هذا اليوم</button>
        </div>

        <div style="margin-top: 4px;">
            <div class="section-title" style="font-size:12px;">سجل الأيام المسجلة</div>
            <div id="workerDaysList" style="max-height: 130px; overflow-y: auto;"></div>
        </div>

        <div class="summary-box" id="workerFinancialSummary"></div>
    </div>
</div>

<!-- نافذة إضافة عامل جديد -->
<div id="addWorkerModal" class="modal-overlay">
    <div class="modal-card">
        <div class="section-title">إضافة عامل جديد</div>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="newWorkerName" placeholder="أدخل اسم العامل">
        </div>
        <div class="input-group">
            <label>الراتب الشهري الأساسي</label>
            <input type="number" id="newWorkerSalary" placeholder="أدخل الراتب">
        </div>
        <button class="btn-primary" onclick="addNewWorker()">حفظ العامل</button>
        <button class="btn-secondary" onclick="closeAddWorkerModal()">إلغاء</button>
    </div>
</div>

<!-- نافذة التقويم المخصص الملون -->
<div id="calendarModal" class="modal-overlay">
    <div class="modal-card" style="text-align: center;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <button class="btn-secondary" style="width: auto; padding: 6px 12px;" onclick="changeCalendarMonth(-1)">▶</button>
            <span id="calMonthYearTitle" style="font-weight: 800; color: #312e81; font-size: 14px;"></span>
            <button class="btn-secondary" style="width: auto; padding: 6px 12px;" onclick="changeCalendarMonth(1)">◀</button>
        </div>
        <div class="calendar-grid">
            <div class="cal-day-name">أحد</div>
            <div class="cal-day-name">إثنين</div>
            <div class="cal-day-name">ثلاثاء</div>
            <div class="cal-day-name">أربعاء</div>
            <div class="cal-day-name">خميس</div>
            <div class="cal-day-name">جمعة</div>
            <div class="cal-day-name">سبت</div>
        </div>
        <div id="calDaysContainer" class="calendar-grid" style="margin-top: 4px;"></div>
        
        <div style="display: flex; justify-content: space-around; margin-top: 10px; font-size: 10px; font-weight: 700; color: #64748b;">
            <span><span style="display:inline-block; width:8px; height:8px; background:#22c55e; border-radius:50%;"></span> داوم</span>
            <span><span style="display:inline-block; width:8px; height:8px; background:#dc2626; border-radius:50%;"></span> غائب</span>
            <span><span style="display:inline-block; width:8px; height:8px; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:50%;"></span> غير مسجل</span>
        </div>

        <button class="btn-secondary" onclick="closeCalendarModal()" style="margin-top: 10px;">إغلاق</button>
    </div>
</div>

<script>
let workers = JSON.parse(localStorage.getItem('my_workers_data')) || [];
let activeWorkerId = null;
let calCurrentDate = new Date();

const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('recordDate').value = todayStr;
updateDateDisplay(todayStr);

function saveData() {
    localStorage.setItem('my_workers_data', JSON.stringify(workers));
}

function updateDateDisplay(dateStr) {
    document.getElementById('recordDateDisplay').value = dateStr;
}

function getDayNameAndDateStr(dateString) {
    const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const d = new Date(dateString);
    const dayName = daysArr[d.getDay()];
    return { dayName, dayOfWeek: d.getDay() };
}

function checkAutoWeekend() {
    const dateVal = document.getElementById('recordDate').value;
    if (!dateVal) return;
    const { dayOfWeek } = getDayNameAndDateStr(dateVal);
    const statusSelect = document.getElementById('recordStatus');
    
    if (dayOfWeek === 0 || dayOfWeek === 6) {
        statusSelect.value = 'weekend';
    } else {
        statusSelect.value = 'present';
    }
    toggleRecordFields();
}

function renderWorkersList() {
    const container = document.getElementById('workersListContainer');
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:15px;">لا يوجد عمال مضافين حالياً.</div>';
        return;
    }

    workers.forEach((worker, index) => {
        const card = document.createElement('div');
        card.className = 'worker-card';
        card.innerHTML = `
            <div style="flex-grow: 1; cursor: pointer;" onclick="openWorkerProfile(${index})">
                <span class="worker-name">👤 ${worker.name}</span>
                <span class="worker-salary">الراتب: ${worker.salary} ليرة (على 30 يوم)</span>
            </div>
            <div>
                <button class="btn-danger" onclick="deleteWorker(event, ${index})">حذف</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function openAddWorkerModal() {
    document.getElementById('newWorkerName').value = '';
    document.getElementById('newWorkerSalary').value = '';
    document.getElementById('addWorkerModal').classList.add('active');
}

function closeAddWorkerModal() {
    document.getElementById('addWorkerModal').classList.remove('active');
}

function addNewWorker() {
    const name = document.getElementById('newWorkerName').value.trim();
    const salary = parseFloat(document.getElementById('newWorkerSalary').value) || 0;

    if (!name || salary <= 0) {
        alert('الرجاء إدخال اسم العامل والراتب الصحيح');
        return;
    }

    workers.push({ name: name, salary: salary, records: [] });
    saveData();
    closeAddWorkerModal();
    renderWorkersList();
}

function deleteWorker(event, index) {
    event.stopPropagation();
    if (confirm('هل أنت متأكد من حذف هذا العامل وكل سجله؟')) {
        workers.splice(index, 1);
        saveData();
        renderWorkersList();
    }
}

function openWorkerProfile(index) {
    activeWorkerId = index;
    const worker = workers[index];
    
    document.getElementById('profileWorkerName').innerText = worker.name;
    document.getElementById('profileWorkerSalary').innerText = `الراتب الشهري: ${worker.salary} ليرة | اليومية: ${(worker.salary/30).toFixed(1)} ليرة`;
    
    document.getElementById('mainHomeView').classList.add('hidden');
    document.getElementById('workerProfileView').classList.remove('hidden');
    
    document.getElementById('recordDate').value = todayStr;
    updateDateDisplay(todayStr);
    checkAutoWeekend();
    renderWorkerDays();
}

function backToHome() {
    activeWorkerId = null;
    document.getElementById('workerProfileView').classList.add('hidden');
    document.getElementById('mainHomeView').classList.remove('hidden');
    renderWorkersList();
}

function toggleRecordFields() {
    const status = document.getElementById('recordStatus').value;
    const extraFields = document.getElementById('extraFieldsContainer');
    if (status === 'absent' || status === 'weekend') {
        extraFields.classList.add('hidden');
    } else {
        extraFields.classList.remove('hidden');
    }
}

function openCalendarModal() {
    document.getElementById('calendarModal').classList.add('active');
    renderCustomCalendar();
}

function closeCalendarModal() {
    document.getElementById('calendarModal').classList.remove('active');
}

function changeCalendarMonth(direction) {
    calCurrentDate.setMonth(calCurrentDate.getMonth() + direction);
    renderCustomCalendar();
}

function renderCustomCalendar() {
    const year = calCurrentDate.getFullYear();
    const month = calCurrentDate.getMonth();
    
    const monthsNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    document.getElementById('calMonthYearTitle').innerText = `${monthsNames[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    
    const container = document.getElementById('calDaysContainer');
    container.innerHTML = '';

    const worker = workers[activeWorkerId];
    const recordsMap = {};
    worker.records.forEach(r => {
        recordsMap[r.date] = r.status;
    });

    const selectedDate = document.getElementById('recordDate').value;

    for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'cal-day empty';
        container.appendChild(emptyDiv);
    }

    for (let d = 1; d <= totalDays; d++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day';
        dayDiv.innerText = d;

        const mFormatted = String(month + 1).padStart(2, '0');
        const dFormatted = String(d).padStart(2, '0');
        const currentDateStr = `${year}-${mFormatted}-${dFormatted}`;

        if (recordsMap[currentDateStr] === 'present') {
            dayDiv.classList.add('recorded-present');
        } else if (recordsMap[currentDateStr] === 'absent') {
            dayDiv.classList.add('recorded-absent');
        } else if (recordsMap[currentDateStr] === 'weekend') {
            dayDiv.classList.add('recorded-weekend');
        }

        if (currentDateStr === selectedDate) {
            dayDiv.classList.add('selected');
        }

        dayDiv.onclick = function() {
            document.getElementById('recordDate').value = currentDateStr;
            updateDateDisplay(currentDateStr);
            
            if (recordsMap[currentDateStr]) {
                document.getElementById('recordStatus').value = recordsMap[currentDateStr];
            } else {
                checkAutoWeekend();
            }
            toggleRecordFields();
            closeCalendarModal();
        };

        container.appendChild(dayDiv);
    }
}

        return;

    const delay = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(docum
