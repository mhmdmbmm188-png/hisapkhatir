<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمال والرواتب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; padding: 10px; color: #1e293b; }
        .app { background: #fff; max-width: 480px; margin: 0 auto; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #312e81; font-size: 18px; margin-bottom: 5px; }
        .dev { text-align: center; font-size: 11px; color: #6366f1; margin-bottom: 15px; font-weight: bold; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 6px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #f8fafc; }
        .worker-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hidden { display: none !important; }
        .summary { background: #4f46e5; color: #fff; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 12px; font-weight: bold; white-space: pre-line; line-height: 1.6; }
        .day-box { background: #f1f5f9; padding: 8px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
        .cal-day { padding: 8px 0; background: #f1f5f9; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .cal-day.present { background: #22c55e; color: #fff; }
        .cal-day.absent { background: #dc2626; color: #fff; }
        .profile-header { background: #e0e7ff; padding: 10px; border-radius: 8px; margin-bottom: 10px; position: relative; }
        .edit-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 16px; cursor: pointer; }
        .backup-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .backup-group .btn { margin-bottom: 0; font-size: 12px; padding: 10px; }
    </style>
</head>
<body>

<div class="app">
    <h2>سجل العمال والرواتب</h2>
    <div class="dev">إعداد: محمد المرعي</div>

    <!-- واجهة الرئيسية -->
    <div id="homeView">
        <button type="button" class="btn btn-primary" onclick="showAddWorker()">➕ إضافة عامل جديد</button>
        <div class="backup-group">
            <button type="button" class="btn btn-warning" onclick="exportData()">⬇️ حفظ نسخة لجهازي</button>
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('importFile').click()">⬆️ استعادة</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
        </div>
        <div id="workersList"></div>
    </div>

    <!-- إضافة عامل -->
    <div id="addView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="showHome()">⬅ رجوع</button>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="workerName" placeholder="أدخل الاسم">
        </div>
        <div class="input-group">
            <label>الراتب الشهري</label>
            <input type="number" id="workerSalary" placeholder="أدخل الراتب">
        </div>
        <button type="button" class="btn btn-primary" onclick="saveWorker()">💾 حفظ العامل</button>
    </div>

    <!-- ملف العامل -->
    <div id="profileView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="showHome()">⬅ رجوع للقائمة</button>
        
        <div class="profile-header">
            <div id="displayWorkerInfo">
                <div id="pName" style="font-weight:bold; color:#312e81; font-size:15px; text-align:center;"></div>
                <div id="pSalary" style="font-size:12px; color:#4338ca; text-align:center;"></div>
                <button type="button" class="edit-btn" onclick="enableEditMode()">✏️</button>
            </div>
            
            <div id="editWorkerInfo" class="hidden">
                <div class="input-group" style="margin-bottom:6px;">
                    <label>اسم العامل</label>
                    <input type="text" id="editWorkerName">
                </div>
                <div class="input-group" style="margin-bottom:6px;">
                    <label>الراتب الشهري</label>
                    <input type="number" id="editWorkerSalary">
                </div>
                <button type="button" class="btn btn-primary" style="padding:6px; font-size:12px; margin-bottom:5px;" onclick="updateWorkerInfo()">💾 تحديث بيانات العامل</button>
                <button type="button" class="btn btn-secondary" style="padding:6px; font-size:12px; margin-bottom:0;" onclick="cancelEditMode()">❌ إلغاء</button>
            </div>
        </div>

        <div class="input-group">
            <label>التاريخ</label>
            <input type="text" id="recDate" readonly onclick="showCal()" style="background:#fff; text-align:center; font-weight:bold; cursor:pointer;">
        </div>

        <div class="input-group">
            <label>الحالة</label>
            <select id="recStatus" onchange="toggleExtra()">
                <option value="present">داوم (كامل)</option>
                <option value="absent">غائب</option>
            </select>
        </div>

        <div id="extraContainer">
            <div class="input-group">
                <label>ساعات الإضافي (1.5x)</label>
                <input type="number" id="recOT" value="0">
            </div>
            <div class="input-group">
                <label>ساعات الإضافي (2x)</label>
                <input type="number" id="recOT2" value="0">
            </div>
            <div class="input-group">
                <label>ساعات التأخير</label>
                <input type="number" id="recDelay" value="0">
            </div>
            <div class="input-group">
                <label>مبلغ مسحوب (سلفية)</label>
                <input type="number" id="recWithdrawn" value="0">
            </div>
        </div>

        <div class="input-group">
            <label>آخر (ضل من حساب القديم / إضافي عام)</label>
            <input type="number" id="recOther" value="0">
        </div>

        <button type="button" class="btn btn-primary" onclick="saveRecord()">💾 حفظ الحركة</button>

        <div style="margin-top:15px; font-weight:bold; font-size:13px;">السجل اليومي:</div>
        <div id="recordsList" style="max-height:180px; overflow-y:auto; margin-top:5px;"></div>

        <div class="summary" id="summaryBox"></div>
        <button type="button" class="btn btn-primary" style="background:#10b981; margin-top:10px;" onclick="copyReport()">📋 نسخ التقرير</button>
    </div>

    <!-- التقويم -->
    <div id="calView" class="hidden">
        <button type="button" class="btn btn-secondary" onclick="hideCal()">⬅ رجوع</button>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button type="button" class="btn btn-secondary" style="width:auto; padding:5px 10px;" onclick="changeMonth(-1)">▶</button>
            <span id="calTitle" style="font-weight:bold; color:#312e81;"></span>
            <button type="button" class="btn btn-secondary" style="width:auto; padding:5px 10px;" onclick="changeMonth(1)">◀</button>
        </div>
        <div class="calendar-grid">
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أحد</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">إثنين</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">ثلاثاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أربعاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">خميس</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">جمعة</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">سبت</div>
        </div>
        <div id="calGrid" class="calendar-grid"></div>
    </div>
</div>

<script>
    let workers = [];
    let activeIdx = null;
    let calDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];

    function showMsg(msg) {
        let m = document.getElementById('toastMsg');
        if(!m) {
            m = document.createElement('div');
            m.id = 'toastMsg';
            m.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#334155;color:#fff;padding:12px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,0.3);display:none;white-space:nowrap;';
            document.body.appendChild(m);
        }
        m.innerText = msg;
        m.style.display = 'block';
        setTimeout(() => m.style.display = 'none', 2500);
    }

    window.onload = function() {
        try {
            if (typeof window.localStorage !== 'undefined') {
                let stored = window.localStorage.getItem('workers_data');
                if (stored) {
                    let parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) workers = parsed;
                }
            }
        } catch (e) {}
        document.getElementById('recDate').value = selectedDateStr;
        renderWorkers();
    };

    function saveData() {
        try {
            if (typeof window.localStorage !== 'undefined') {
                window.localStorage.setItem('workers_data', JSON.stringify(workers));
            }
        } catch (e) {
            showMsg('الذاكرة غير مدعومة');
        }
    }

    function exportData() {
        if (workers.length === 0) {
            showMsg('لا يوجد عمال لحفظهم');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workers));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `hisab_backup_${selectedDateStr}.json`);
        dlAnchorElem.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    workers = imported;
                    saveData();
                    renderWorkers();
                    showMsg('تم استعادة البيانات بنجاح!');
                } else {
                    showMsg('الملف غير صحيح');
                }
            } catch (err) {
                showMsg('خطأ بقراءة الملف');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function showHome() {
        activeIdx = null;
        document.getElementById('addView').classList.add('hidden');
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('calView').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        renderWorkers();
    }

    function showAddWorker() {
        document.getElementById('workerName').value = '';
        document.getElementById('workerSalary').value = '';
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('addView').classList.remove('hidden');
    }

    function saveWorker() {
        const nameField = document.getElementById('workerName');
        const salaryField = document.getElementById('workerSalary');
        
        const name = nameField.value.trim();
        const salary = parseFloat(salaryField.value) || 0;
        
        if (!name || salary <= 0) {
            showMsg('اكتب الاسم والراتب بشكل صحيح');
            return;
        }
        
        workers.push({ name: name, salary: salary, records: [], other: 0 });
        saveData();
        showHome();
        showMsg('تم إضافة العامل بنجاح');
    }

    function enableEditMode() {
        document.getElementById('displayWorkerInfo').classList.add('hidden');
        document.getElementById('editWorkerInfo').classList.remove('hidden');
    }

    function cancelEditMode() {
        document.getElementById('displayWorkerInfo').classList.remove('hidden');
        document.getElementById('editWorkerInfo').classList.add('hidden');
    }

    function updateWorkerInfo() {
        if (activeIdx === null) return;
        const name = document.getElementById('editWorkerName').value.trim();
        const salary = parseFloat(document.getElementById('editWorkerSalary').value) || 0;
        if (!name || salary <= 0) {
            showMsg('تأكد من الاسم والراتب');
            return;
        }
        workers[activeIdx].name = name;
        workers[activeIdx].salary = salary;
        saveData();
        document.getElementById('pName').innerText = name;
        document.getElementById('pSalary').innerText = `الراتب: ${salary} | اليومية: ${(salary/30).toFixed(1)}`;
        cancelEditMode();
        renderRecords();
        showMsg('تم التحديث');
    }

    function renderWorkers() {
        const list = document.getElementById('workersList');
        list.innerHTML = '';
        if (workers.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:15px;">لا يوجد عمال.</div>';
            return;
        }
        workers.forEach((w, i) => {
            const div = document.createElement('div');
            div.className = 'worker-card';
            div.innerHTML = `
                <div style="flex-grow:1; cursor:pointer;" onclick="openProfile(${i})">
                    <div style="font-weight:bold;">👤 ${w.name}</div>
                    <div style="font-size:11px; color:#64748b;">الراتب: ${w.salary}</div>
                </div>
                <button type="button" class="btn-danger" onclick="deleteWorker(event, ${i})">حذف</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteWorker(e, i) {
        e.stopPropagation();
        workers.splice(i, 1);
        saveData();
        renderWorkers();
        showMsg('تم حذف العامل');
    }

    function openProfile(i) {
        activeIdx = i;
        const w = workers[i];
        document.getElementById('pName').innerText = w.name;
        document.getElementById('pSalary').innerText = `الراتب: ${w.salary} | اليومية: ${(w.salary/30).toFixed(1)}`;
        document.getElementById('editWorkerName').value = w.name;
        document.getElementById('editWorkerSalary').value = w.salary;
        cancelEditMode(); 
        document.getElementById('recOther').value = w.other || 0;
        document.getElementById('recOT').value = '0';
        document.getElementById('recOT2').value = '0';
        document.getElementById('recDelay').value = '0';
        document.getElementById('recWithdrawn').value = '0';
        document.getElementById('recStatus').value = 'present';
        toggleExtra();
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');
        renderRecords();
    }

    function toggleExtra() {
        const s = document.getElementById('recStatus').value;
        const extra = document.getElementById('extraContainer');
        if (s === 'absent') extra.classList.add('hidden');
        else extra.classList.remove('hidden');
    }

    function saveRecord() {
        if (activeIdx === null) return;
        const w = workers[activeIdx];
        if (!w.records) w.records = [];
        const date = document.getElementById('recDate').value;
        const status = document.getElementById('recStatus').value;

        w.records = w.records.filter(r => r.date !== date);
        w.records.push({
            date: date,
            status: status,
            ot: status === 'absent' ? 0 : parseFloat(document.getElementById('recOT').value) || 0,
            ot2: status === 'absent' ? 0 : parseFloat(document.getElementById('recOT2').value) || 0,
            delay: status === 'absent' ? 0 : parseFloat(document.getElementById('recDelay').value) || 0,
            withdrawn: parseFloat(document.getElementById('recWithdrawn').value) || 0
        });
        w.other = parseFloat(document.getElementById('recOther').value) || 0;
        w.records.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveData();
        renderRecords();
        showMsg('تم حفظ الحركة');
    }

    function getFormattedDateName(dateStr) {
        const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const d = new Date(dateStr);
        const dayName = daysArr[d.getDay()];
        const parts = dateStr.split('-');
        const formatted = `${parts[2]}.${parts[1]}.${parts[0]}`;
        return `يوم ${dayName} ${formatted}`;
    }

    function generateReportText() {
        const w = workers[activeIdx];
        const recs = w.records || [];
        let days = 0, otTot = 0, ot2Tot = 0, delayTot = 0, withTot = 0, absentTot = 0;
        let delayDates = [], absentDates = [];
        recs.forEach(r => {
            if (r.status === 'present') {
                days++;
                if ((r.delay || 0) > 0) { delayTot += r.delay; delayDates.push(getFormattedDateName(r.date)); }
            } else if (r.status === 'absent') {
                absentTot++; absentDates.push(getFormattedDateName(r.date));
            }
            otTot += (r.ot || 0); ot2Tot += (r.ot2 || 0); withTot += (r.withdrawn || 0);
        });
        const daily = w.salary / 30;
        const hourly = daily / 9;
        const earnedDays = days * daily;
        const earnedOt = otTot * hourly * 1.5;
        const earnedOt2 = ot2Tot * hourly * 2;
        const cutDelay = delayTot * hourly;
        const cutAbsence = absentTot * daily;
        const otherVal = w.other || 0;
        const net = earnedDays + earnedOt + earnedOt2 - cutDelay - cutAbsence - withTot + otherVal;

        let txt = `📊 تقرير تفاصيل الراتب\n`;
        txt += `👤 اسم العامل: ${w.name}\n`;
        txt += `💰 الراتب الشهري: ${w.salary} ليرة\n`;
        txt += `-------------------\n`;
        txt += `📅 كم يوم مداوم (${days} يوم): ${earnedDays.toFixed(2)} ليرة\n`;
        if (otTot > 0) txt += `➕ إضافي (1.5x) (${otTot} ساعة): +${earnedOt.toFixed(2)} ليرة\n`;
        if (ot2Tot > 0) txt += `➕ إضافي (2x) (${ot2Tot} ساعة): +${earnedOt2.toFixed(2)} ليرة\n`;
        if (delayTot > 0) { txt += `➖ التأخير (${delayTot} ساعة): -${cutDelay.toFixed(2)} ليرة\n   📌 تواريخ التأخير: ${delayDates.join(' - ')}\n`; }
        if (absentTot > 0) { txt += `➖ الغياب (${absentTot} يوم): -${cutAbsence.toFixed(2)} ليرة\n   📌 تواريخ الغياب: ${absentDates.join(' - ')}\n`; }
        if (withTot > 0) txt += `➖ ساحب: -${withTot.toFixed(2)} ليرة\n`;
        if (otherVal !== 0) txt += `➕ آخر: ${otherVal > 0 ? '+' : ''}${otherVal.toFixed(2)} ليرة\n`;
        txt += `-------------------\n`;
        txt += `💰 المجموع الكامل: ${net.toFixed(2)} ليرة`;
        return txt;
    }

    function renderRecords() {
        const list = do
