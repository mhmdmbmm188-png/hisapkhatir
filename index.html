<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>سجل العمال والرواتب - محمد المرعي</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', Tahoma, Arial, sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #1e293b;
        }

        .app {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        h2 {
            color: #312e81;
            font-size: 22px;
            font-weight: 800;
        }

        .developer-tag {
            font-size: 12px;
            color: #6366f1;
            font-weight: 700;
            margin-top: 2px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            width: 100%;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .btn-primary:hover { background: #4338ca; }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .worker-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .worker-card:hover {
            border-color: #6366f1;
            background: #fff;
        }

        .worker-info span { display: block; }

        .worker-name {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }

        .worker-salary {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-top: 2px;
        }

        .input-group { margin-bottom: 10px; }

        label {
            display: block;
            margin-bottom: 4px;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: #fff;
        }

        .day-record-box {
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .day-record-header {
            font-weight: 800;
            color: #312e81;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .summary-box {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            padding: 14px;
            border-radius: 14px;
            margin-top: 14px;
        }

        .summary-box div {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 700;
        }

        .summary-total {
            font-size: 16px !important;
            font-weight: 800 !important;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 6px;
            margin-top: 6px;
        }

        .period-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .period-title {
            font-weight: 800;
            color: #3730a3;
            font-size: 13px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #c7d2fe;
            padding-bottom: 2px;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>

<div class="app">
    <div class="app-header">
        <h2>سجل العمال والرواتب</h2>
        <div class="developer-tag">إعداد: محمد المرعي</div>
    </div>

    <!-- واجهة قائمة العمال الرئيسية -->
    <div id="mainHomeView">
        <div class="section-title">
            <span>قائمة العمال</span>
        </div>
        <button class="btn-primary" onclick="openAddWorkerModal()">➕ إضافة عامل جديد</button>
        <div id="workersListContainer" style="max-height: 380px; overflow-y: auto; margin-top: 8px;"></div>
    </div>

    <!-- واجهة ملف العامل الشخصي واليوميات -->
    <div id="workerProfileView" class="hidden">
        <button class="btn-secondary" onclick="backToHome()">⬅ العودة للقائمة</button>
        
        <div style="margin-top: 10px; background: #e0e7ff; padding: 10px; border-radius: 12px; text-align: center;">
            <div id="profileWorkerName" style="font-size: 15px; font-weight: 800; color: #312e81;"></div>
            <div id="profileWorkerSalary" style="font-size: 12px; color: #4338ca; font-weight: 700;"></div>
        </div>

        <div style="margin-top: 10px; border-top: 2px solid #f1f5f9; padding-top: 8px;">
            <div class="section-title" style="font-size:13px;">تسجيل حركة يومية</div>
            
            <div class="input-group">
                <label>التاريخ</label>
                <input type="date" id="recordDate" onchange="checkAutoWeekend()">
            </div>

            <div class="input-group">
                <label>حالة الدوام (السبت والأحد عطلة تلقائية)</label>
                <select id="recordStatus" onchange="toggleRecordFields()">
                    <option value="present">داوم (كامل)</option>
                    <option value="absent">غائب</option>
                    <option value="weekend">عطلة رسمية (سبت/أحد)</option>
                </select>
            </div>

            <div id="extraFieldsContainer">
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعة ونصف)</label>
                    <input type="number" id="recordOvertime" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات الإضافي (ساعة بساعتين)</label>
                    <input type="number" id="recordOvertimeDouble" value="0">
                </div>
                <div class="input-group">
                    <label>ساعات التأخير</label>
                    <input type="number" id="recordDelay" value="0">
                </div>
                <div class="input-group">
                    <label>مبلغ مسحوب (سلفية / سحب)</label>
                    <input type="number" id="recordWithdrawn" value="0">
                </div>
            </div>

            <button class="btn-primary" onclick="saveDayRecord()">💾 حفظ حركة هذا اليوم</button>
        </div>

        <div style="margin-top: 5px;">
            <div class="section-title" style="font-size:13px;">سجل الأيام المسجلة</div>
            <div id="workerDaysList" style="max-height: 150px; overflow-y: auto;"></div>
        </div>

        <div class="summary-box" id="workerFinancialSummary"></div>
    </div>
</div>

<!-- نافذة إضافة عامل جديد -->
<div id="addWorkerModal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding: 20px;">
    <div style="background:white; padding:20px; border-radius:20px; width:100%; max-width:380px;">
        <div class="section-title">إضافة عامل جديد</div>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="newWorkerName" placeholder="أدخل اسم العامل">
        </div>
        <div class="input-group">
            <label>الراتب الشهري الأساسي</label>
            <input type="number" id="newWorkerSalary" placeholder="أدخل الراتب">
        </div>
        <button class="btn-primary" onclick="addNewWorker()">حفظ العامل</button>
        <button class="btn-secondary" onclick="closeAddWorkerModal()" style="width:100%; margin-top:4px;">إلغاء</button>
    </div>
</div>

<script>
let workers = JSON.parse(localStorage.getItem('my_workers_data')) || [];
let activeWorkerId = null;

// ضبط تاريخ اليوم افتراضياً وفحص إذا كان عطلة
document.getElementById('recordDate').valueAsDate = new Date();
checkAutoWeekend();

function saveData() {
    localStorage.setItem('my_workers_data', JSON.stringify(workers));
}

function getDayNameAndDateStr(dateString) {
    const daysArr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const d = new Date(dateString);
    const dayName = daysArr[d.getDay()];
    return { dayName, dayOfWeek: d.getDay() };
}

function checkAutoWeekend() {
    const dateVal = document.getElementById('recordDate').value;
    if (!dateVal) return;
    const { dayOfWeek } = getDayNameAndDateStr(dateVal);
    const statusSelect = document.getElementById('recordStatus');
    
    // 0 = الأحد, 6 = السبت
    if (dayOfWeek === 0 || dayOfWeek === 6) {
        statusSelect.value = 'weekend';
    } else {
        statusSelect.value = 'present';
    }
    toggleRecordFields();
}

function renderWorkersList() {
    const container = document.getElementById('workersListContainer');
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px; padding:20px;">لا يوجد عمال مضافين حالياً.</div>';
        return;
    }

    workers.forEach((worker, index) => {
        const card = document.createElement('div');
        card.className = 'worker-card';
        card.innerHTML = `
            <div class="worker-info" onclick="openWorkerProfile(${index})">
                <span class="worker-name">👤 ${worker.name}</span>
                <span class="worker-salary">الراتب: ${worker.salary} ليرة (على 30 يوم)</span>
            </div>
            <div>
                <button class="btn-danger" onclick="deleteWorker(event, ${index})">حذف</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function openAddWorkerModal() {
    document.getElementById('newWorkerName').value = '';
    document.getElementById('newWorkerSalary').value = '';
    document.getElementById('addWorkerModal').classList.remove('hidden');
}

function closeAddWorkerModal() {
    document.getElementById('addWorkerModal').classList.add('hidden');
}

function addNewWorker() {
    const name = document.getElementById('newWorkerName').value.trim();
    const salary = parseFloat(document.getElementById('newWorkerSalary').value) || 0;

    if (!name || salary <= 0) {
        alert('الرجاء إدخال اسم العامل والراتب الصحيح');
        return;
    }

    workers.push({ name: name, salary: salary, records: [] });
    saveData();
    closeAddWorkerModal();
    renderWorkersList();
}

function deleteWorker(event, index) {
    event.stopPropagation();
    if (confirm('هل أنت متأكد من حذف هذا العامل وكل سجله؟')) {
        workers.splice(index, 1);
        saveData();
        renderWorkersList();
    }
}

function openWorkerProfile(index) {
    activeWorkerId = index;
    const worker = workers[index];
    
    document.getElementById('profileWorkerName').innerText = worker.name;
    document.getElementById('profileWorkerSalary').innerText = `الراتب الشهري: ${worker.salary} ليرة | اليومية: ${(worker.salary/30).toFixed(1)} ليرة`;
    
    document.getElementById('mainHomeView').classList.add('hidden');
    document.getElementById('workerProfileView').classList.remove('hidden');
    
    checkAutoWeekend();
    renderWorkerDays();
}

function backToHome() {
    activeWorkerId = null;
    document.getElementById('workerProfileView').classList.add('hidden');
    document.getElementById('mainHomeView').classList.remove('hidden');
    renderWorkersList();
}

function toggleRecordFields() {
    const status = document.getElementById('recordStatus').value;
    const extraFields = document.getElementById('extraFieldsContainer');
    if (status === 'absent' || status === 'weekend') {
        extraFields.classList.add('hidden');
    } else {
        extraFields.classList.remove('hidden');
    }
}

function saveDayRecord() {
    const date = document.getElementById('recordDate').value;
    const status = document.getElementById('recordStatus').value;
    
    if (!date) {
        alert('الرجاء اختيار التاريخ');
        return;
    }

    const overtime = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertime').value) || 0);
    const overtimeDouble = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordOvertimeDouble').value) || 0);
    const delay = status === 'weekend' || status === 'absent' ? 0 : (parseFloat(document.getElementById('recordDelay').value) || 0);
    const withdrawn = parseFloat(document.getElementById('recordWithdrawn').value) || 0;

    const worker = workers[activeWorkerId];
    worker.records = worker.records.filter(r => r.date !== date);

    worker.records.push({
        date: date,
        status: status,
        overtime: overtime,
        overtimeDouble: overtimeDouble,
        delay: delay,
        withdrawn: withdrawn
    });

    worker.records.sort((a, b) => new Date(b.date) - new Date(a.date));

    saveData();
    renderWorkerDays();
    alert('✅ تم حفظ الحركة بنجاح');
}

function deleteDayRecord(date) {
    if (confirm('⚠️ هل أنت متأكد من حذف سجل هذا اليوم؟')) {
        const worker = workers[activeWorkerId];
        worker.records = worker.records.filter(r => r.date !== date);
        saveData();
        renderWorkerDays();
    }
}

function renderWorkerDays() {
    const worker = workers[activeWorkerId];
    const container = document.getElementById('workerDaysList');
    container.innerHTML = '';

    if (worker.records.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:11px; padding:10px;">لا توجد أيام مسجلة بعد.</div>';
        document.getElementById('workerFinancialSummary').innerHTML = '<div>لا توجد بيانات حسابية بعد</div>';
        return;
    }

    const dailyRate = worker.salary / 30;
    const hourlyRate = dailyRate / 9;

    let p1Work = 0, p1Abs = 0, p1Ot15 = 0, p1Ot2 = 0, p1Delay = 0, p1Withdrawn = 0;
    let p2Work = 0, p2Abs = 0, p2Ot15 = 0, p2Ot2 = 0, p2Delay = 0, p2Withdrawn = 0;

    worker.records.forEach(rec => {
        const { dayName } = getDayNameAndDateStr(rec.date);
        const dayNum = parseInt(rec.date.split('-')[2]); // رقم اليوم من التاريخ

        if (dayNum <= 15) {
            if (rec.status === 'present') p1Work++;
            if (rec.status === 'absent') p1Abs++;
            p1Ot15 += rec.overtime;
            p1Ot2 += rec.overtimeDouble;
            p1Delay += rec.delay;
            p1Withdrawn += rec.withdrawn;
        } else {
            if (rec.status === 'present') p2Work++;
            if (rec.status === 'absent') p2Abs++;
            p2Ot15 += rec.overtime;
            p2Ot2 += rec.overtimeDouble;
            p2Delay += rec.delay;
            p2Withdrawn += rec.withdrawn;
        }

        const box = document.createElement('div');
        box.className = 'day-record-box';
        
        let statusLabel = '🟢 دوام كامل';
        if (rec.status === 'absent') statusLabel = '🔴 غائب';
        if (rec.status === 'weekend') statusLabel = '🌴 عطلة رسمية (سبت/أحد)';

        let detailsText = `الحالة: ${statusLabel} (يومية: ${dailyRate.toFixed(1)} ليرة)`;
        if (rec.status === 'present') {
            if (rec.overtime > 0) detailsText += ` | إضافي 1.5x: ${rec.overtime}س`;
            if (rec.overtimeDouble > 0) detailsText += ` | إضافي 2x: ${rec.overtimeDouble}س`;
            if (rec.delay > 0) detailsText += ` | تأخير: ${rec.delay}س`;
        }
        if (rec.withdrawn > 0) detailsText += ` | سحب/سلفية: ${rec.withdrawn} ليرة`;

        box.innerHTML = `
            <div class="day-record-header">
                <span>📅 ${rec.date} (${dayName})</span>
                <span style="cursor:pointer; color:#dc2626;" onclick="deleteDayRecord('${rec.date}')">حذف</span>
            </div>
            <div>${detailsText}</div>
        `;
        container.appendChild(box);
    });

    // حساب مبالغ الفترة الأولى (1 إلى 15)
    const p1AmtWork = p1Work * dailyRate;
    const p1AmtOt = (p1Ot15 * hourlyRate * 1.5) + (p1Ot2 * hourlyRate * 2);
    const p1AmtDelay = p1Delay * hourlyRate;
    const p1Net = p1AmtWork + p1AmtOt - p1AmtDelay - p1Withdrawn;

    // حساب مبالغ الفترة الثانية (16 إلى 30)
    const p2AmtWork = p2Work * dailyRate;
    const p2AmtOt = (p2Ot15 * hourlyRate * 1.5) + (p2Ot2 * hourlyRate * 2);
    const p2AmtDelay = p2Delay * hourlyRate;
    const p2Net = p2AmtWork + p2AmtOt - p2AmtDelay - p2Withdrawn;

    const totalNetMonth = p1Net + p2Net;

    document.getElementById('workerFinancialSummary').innerHTML = `
        <div class="period-box">
            <div class="period-title">📌 محاسبة النصف الأول (من 1 إلى 15):</div>
            <div>أيام الدوام: ${p1Work} يوم | السحوبات: ${p1Withdrawn} ليرة</div>
            <div style="font-weight:800; color:#312e81;">صافي الفترة الأولى: ${p1Net.toFixed(1)} ليرة</div>
        </div>

        <div class="period-box">
            <div class="period-title">📌 محاسبة النصف الثاني (من 16 إلى 30):</div>
            <div>أيام الدوام: ${p2Work} يوم | السحوبات: ${p2Withdrawn} ليرة</div>
            <div style="font-weight:800; color:#312e81;">صافي الفترة الثانية: ${p2Net.toFixed(1)} ليرة</div>
        </div>

        <div class="summary-total">إجمالي المستحق للشهر بالكامل: ${totalNetMonth.toFixed(2)} ليرة</div>
    `;
}

renderWorkersList();
</script>

</body>
</html>
