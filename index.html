<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمال والرواتب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; padding: 10px; color: #1e293b; }
        .app { background: #fff; max-width: 480px; margin: 0 auto; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #312e81; font-size: 18px; margin-bottom: 5px; }
        .dev { text-align: center; font-size: 11px; color: #6366f1; margin-bottom: 15px; font-weight: bold; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 6px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #f8fafc; }
        .worker-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hidden { display: none !important; }
        .summary { background: #4f46e5; color: #fff; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; font-weight: bold; }
        .day-box { background: #f1f5f9; padding: 8px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
        .cal-day { padding: 8px 0; background: #f1f5f9; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .cal-day.present { background: #22c55e; color: #fff; }
        .cal-day.absent { background: #dc2626; color: #fff; }
        .cal-day.weekend { background: #64748b; color: #fff; }
    </style>
</head>
<body>

<div class="app">
    <h2>سجل العمال والرواتب</h2>
    <div class="dev">إعداد: محمد المرعي</div>

    <!-- Home View -->
    <div id="homeView">
        <button class="btn btn-primary" onclick="showAddWorker()">➕ إضافة عامل جديد</button>
        <div id="workersList"></div>
    </div>

    <!-- Add Worker View -->
    <div id="addView" class="hidden">
        <button class="btn btn-secondary" onclick="showHome()">⬅ رجوع</button>
        <div class="input-group">
            <label>اسم العامل</label>
            <input type="text" id="workerName" placeholder="أدخل الاسم">
        </div>
        <div class="input-group">
            <label>الراتب الشهري</label>
            <input type="number" id="workerSalary" placeholder="أدخل الراتب">
        </div>
        <button class="btn btn-primary" onclick="saveWorker()">💾 حفظ العامل</button>
    </div>

    <!-- Worker Profile View -->
    <div id="profileView" class="hidden">
        <button class="btn btn-secondary" onclick="showHome()">⬅ رجوع للقائمة</button>
        <div style="background:#e0e7ff; padding:10px; border-radius:8px; text-align:center; margin-bottom:10px;">
            <div id="pName" style="font-weight:bold; color:#312e81; font-size:15px;"></div>
            <div id="pSalary" style="font-size:12px; color:#4338ca;"></div>
        </div>

        <div class="input-group">
            <label>التاريخ</label>
            <input type="text" id="recDate" readonly onclick="showCal()" style="background:#fff; text-align:center; font-weight:bold; cursor:pointer;">
        </div>

        <div class="input-group">
            <label>الحالة</label>
            <select id="recStatus" onchange="toggleExtra()">
                <option value="present">داوم (كامل)</option>
                <option value="absent">غائب</option>
                <option value="weekend">عطلة</option>
            </select>
        </div>

        <div id="extraContainer">
            <div class="input-group">
                <label>ساعات الإضافي (1.5x)</label>
                <input type="number" id="recOT" value="0">
            </div>
            <div class="input-group">
                <label>ساعات الإضافي (2x)</label>
                <input type="number" id="recOT2" value="0">
            </div>
            <div class="input-group">
                <label>ساعات التأخير</label>
                <input type="number" id="recDelay" value="0">
            </div>
            <div class="input-group">
                <label>مبلغ مسحوب (سلفية)</label>
                <input type="number" id="recWithdrawn" value="0">
            </div>
        </div>

        <button class="btn btn-primary" onclick="saveRecord()">💾 حفظ الحركة</button>

        <div style="margin-top:15px; font-weight:bold; font-size:13px;">السجل اليومي:</div>
        <div id="recordsList" style="max-height:150px; overflow-y:auto; margin-top:5px;"></div>

        <div class="summary" id="summaryBox"></div>
        <button class="btn btn-primary" style="background:#10b981; margin-top:10px;" onclick="copyReport()">📋 نسخ التقرير</button>
    </div>

    <!-- Calendar View -->
    <div id="calView" class="hidden">
        <button class="btn btn-secondary" onclick="hideCal()">⬅ رجوع</button>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button class="btn btn-secondary" style="width:auto; padding:5px 10px;" onclick="changeMonth(-1)">▶</button>
            <span id="calTitle" style="font-weight:bold; color:#312e81;"></span>
            <button class="btn btn-secondary" style="width:auto; padding:5px 10px;" onclick="changeMonth(1)">◀</button>
        </div>
        <div class="calendar-grid">
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أحد</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">إثنين</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">ثلاثاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">أربعاء</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">خميس</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">جمعة</div>
            <div style="font-size:11px; font-weight:bold; color:#64748b;">سبت</div>
        </div>
        <div id="calGrid" class="calendar-grid"></div>
    </div>
</div>

<script>
    let workers = JSON.parse(localStorage.getItem('workers_data')) || [];
    let activeIdx = null;
    let calDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];

    window.onload = function() {
        document.getElementById('recDate').value = selectedDateStr;
        renderWorkers();
    };

    function saveData() {
        localStorage.setItem('workers_data', JSON.stringify(workers));
    }

    function showHome() {
        activeIdx = null;
        document.getElementById('addView').classList.add('hidden');
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('calView').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        renderWorkers();
    }

    function showAddWorker() {
        document.getElementById('workerName').value = '';
        document.getElementById('workerSalary').value = '';
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('addView').classList.remove('hidden');
    }

    function saveWorker() {
        const name = document.getElementById('workerName').value.trim();
        const salary = parseFloat(document.getElementById('workerSalary').value) || 0;
        if (!name || salary <= 0) {
            alert('الرجاء إدخال الاسم بشكل صحيح وراتب أكبر من الصفر');
            return;
        }
        workers.push({ name: name, salary: salary, records: [] });
        saveData();
        showHome();
    }

    function renderWorkers() {
        const list = document.getElementById('workersList');
        list.innerHTML = '';
        if (workers.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:12px; padding:15px;">لا يوجد عمال.</div>';
            return;
        }
        workers.forEach((w, i) => {
            const div = document.createElement('div');
            div.className = 'worker-card';
            div.innerHTML = `
                <div style="flex-grow:1; cursor:pointer;" onclick="openProfile(${i})">
                    <div style="font-weight:bold;">👤 ${w.name}</div>
                    <div style="font-size:11px; color:#64748b;">الراتب: ${w.salary}</div>
                </div>
                <button class="btn-danger" onclick="deleteWorker(event, ${i})">حذف</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteWorker(e, i) {
        e.stopPropagation();
        if (confirm('حذف العامل؟')) {
            workers.splice(i, 1);
            saveData();
            renderWorkers();
        }
    }

    function openProfile(i) {
        activeIdx = i;
        const w = workers[i];
        document.getElementById('pName').innerText = w.name;
        document.getElementById('pSalary').innerText = `الراتب الشهري: ${w.salary} | اليومية: ${(w.salary/30).toFixed(1)}`;
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');
        renderRecords();
    }

    function toggleExtra() {
        const s = document.getElementById('recStatus').value;
        const extra = document.getElementById('extraContainer');
        if (s === 'absent' || s === 'weekend') extra.classList.add('hidden');
        else extra.classList.remove('hidden');
    }

    function saveRecord() {
        if (activeIdx === null) return;
        const w = workers[activeIdx];
        if (!w.records) w.records = [];
        const date = document.getElementById('recDate').value;
        const status = document.getElementById('recStatus').value;

        w.records = w.records.filter(r => r.date !== date);
        w.records.push({
            date: date,
            status: status,
            ot: status === 'absent' || status === 'weekend' ? 0 : parseFloat(document.getElementById('recOT').value) || 0,
            ot2: status === 'absent' || status === 'weekend' ? 0 : parseFloat(document.getElementById('recOT2').value) || 0,
            delay: status === 'absent' || status === 'weekend' ? 0 : parseFloat(document.getElementById('recDelay').value) || 0,
            withdrawn: parseFloat(document.getElementById('recWithdrawn').value) || 0
        });
        w.records.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveData();
        renderRecords();
        alert('تم الحفظ بنجاح');
    }

    function renderRecords() {
        const list = document.getElementById('recordsList');
        const summary = document.getElementById('summaryBox');
        list.innerHTML = '';
        const w = workers[activeIdx];
        const recs = w.records || [];
        if (recs.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:11px;">لا توجد حركات.</div>';
            summary.innerHTML = 'الصافي: 0';
            return;
        }

        let days = 0, otTot = 0, ot2Tot = 0, delayTot = 0, withTot = 0;
        recs.forEach((r, idx) => {
            if (r.status === 'present') days++;
            otTot += (r.ot || 0);
            ot2Tot += (r.ot2 || 0);
            delayTot += (r.delay || 0);
            withTot += (r.withdrawn || 0);

            let stTxt = r.status === 'present' ? 'داوم' : (r.status === 'absent' ? 'غائب' : 'عطلة');
            const div = document.createElement('div');
            div.className = 'day-box';
            div.innerHTML = `
                <div><b>${r.date}</b> (${stTxt})</div>
                <button class="btn-danger" onclick="deleteRec(${idx})">حذف</button>
            `;
            list.appendChild(div);
        });

        const daily = w.salary / 30;
        const hourly = daily / 9;
        const earned = days * daily;
        const otEarn = (otTot * hourly * 1.5) + (ot2Tot * hourly * 2);
        const delayCut = delayTot * hourly;
        const net = earned + otEarn - delayCut - withTot;

        summary.innerHTML = `أيام الدوام: ${days} | الإضافي: +${otEarn.toFixed(1)} | التأخير: -${delayCut.toFixed(1)} | السلف: -${withTot.toFixed(1)}<br>الصافي النهائي: ${net.toFixed(1)} ليرة`;
    }

    function deleteRec(idx) {
        workers[activeIdx].records.splice(idx, 1);
        saveData();
        renderRecords();
    }

    function showCal() {
        document.getElementById('profileView').classList.add('hidden');
        document.getElementById('calView').classList.remove('hidden');
        renderCalendar();
    }

    function hideCal() {
        document.getElementById('calView').classList.add('hidden');
        document.getElementById('profileView').classList.remove('hidden');
    }

    function changeMonth(dir) {
        calDate.setMonth(calDate.getMonth() + dir);
        renderCalendar();
    }

    function renderCalendar() {
        const y = calDate.getFullYear();
        const m = calDate.getMonth();
        const mNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        document.getElementById('calTitle').innerText = `${mNames[m]} ${y}`;

        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        const recsMap = {};
        if (workers[activeIdx].records) {
            workers[activeIdx].records.forEach(r => recsMap[r.date] = r.status);
        }

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        for (let d = 1; d <= totalDays; d++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'cal-day';
            dayDiv.innerText = d;
            const mStr = String(m + 1).padStart(2, '0');
            const dStr = String(d).padStart(2, '0');
            const dKey = `${y}-${mStr}-${dStr}`;

            if (recsMap[dKey]) {
                dayDiv.classList.add(recsMap[dKey]);
            }

            dayDiv.onclick = function() {
                selectedDateStr = dKey;
                document.getElementById('recDate').value = dKey;
                document.getElementById('recStatus').value = 'present';
                document.getElementById('recOT').value = '0';
                document.getElementById('recOT2').value = '0';
                document.getElementById('recDelay').value = '0';
                document.getElementById('recWithdrawn').value = '0';
                toggleExtra();
                hideCal();
            };
            grid.appendChild(dayDiv);
        }
    }

    function copyReport() {
        if (activeIdx === null) return;
        const w = workers[activeIdx];
        const recs = w.records || [];
        let days = 0, otTot = 0, ot2Tot = 0, delayTot = 0, withTot = 0;
        recs.forEach(r => {
            if (r.status === 'present') days++;
            otTot += (r.ot || 0);
            ot2Tot += (r.ot2 || 0);
            delayTot += (r.delay || 0);
            withTot += (r.withdrawn || 0);
        });
        const daily = w.salary / 30;
        const hourly = daily / 9;
        const net = (days * daily) + (otTot * hourly * 1.5) + (ot2Tot * hourly * 2) - (delayTot * hourly) - withTot;

        const text = `كشف حساب: ${w.name}\nالراتب الأساسي: ${w.salary}\nأيام الدوام: ${days}\nالصافي المستحق: ${net.toFixed(1)} ليرة`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => alert('تم النسخ'));
        } else {
            alert(text);
        }
    }
</script>
</body>
</html>
